<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1565c0" />
  <title>ResusPro BloodGas</title>
  <style>
    :root{
      --blue:#1565c0; --blue2:#0d47a1; --bg:#eef2f6; --card:#fff; --line:#d9e1ea;
      --text:#101828; --muted:#526070; --soft:#e8eef5; --danger:#b42318;
      --shadow:0 2px 12px rgba(16,24,40,.08);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;padding:0;width:100%;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
    body{padding:10px;padding-bottom:28px}
    .app{width:100%;max-width:900px;margin:0 auto}
    .hero{background:linear-gradient(135deg,var(--blue),#1976d2);color:#fff;border-radius:16px;padding:8px 10px;margin:0 0 10px;box-shadow:var(--shadow)}
    .hero-top{display:flex;gap:10px;align-items:center;justify-content:space-between;min-width:0}
    .brand-link{display:flex;align-items:center;gap:9px;min-width:0;color:#fff;text-decoration:none}
    .logo-pill{background:rgba(255,255,255,.94);border-radius:13px;padding:5px 8px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 5px rgba(16,24,40,.18);flex:0 0 auto}
    .app-logo{width:128px;max-width:42vw;height:auto;display:block}
    .brand-text{min-width:0}
    h1{font-size:1rem;line-height:1.05;margin:0;font-weight:850;letter-spacing:.2px;white-space:normal}
    .subtitle{font-size:.76rem;margin-top:2px;opacity:.95;line-height:1.15}
    .btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    button,.button-like,select,input{font:inherit}
    button{border:0;border-radius:14px;padding:12px 14px;font-weight:760;background:var(--soft);color:var(--text);cursor:pointer;min-height:44px}
    button.primary{background:#fff;color:var(--blue2)}
    button.blue{background:var(--blue);color:#fff}
    button.small{padding:9px 11px;min-height:38px;border-radius:12px;font-size:.92rem}
    button.danger{background:#fee4e2;color:var(--danger)}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;margin:12px 0;box-shadow:var(--shadow);overflow:hidden}
    .card h2{font-size:1.12rem;margin:0;padding:14px 16px 8px}
    .section{padding:12px 16px;border-top:1px solid var(--line)}
    label{display:block;font-weight:720;color:#344054;margin:10px 0 6px;font-size:.95rem}
    input[type="text"],input[type="number"],select{width:100%;border:1px solid #cfd8e3;border-radius:14px;background:#fff;padding:12px 13px;min-height:46px;color:var(--text);font-size:1rem}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .sample-buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .sample-buttons button{background:var(--soft);font-size:.94rem;padding:10px 8px}
    .sample-buttons button.active{background:var(--blue);color:#fff}
    .preset-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
    .stage-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .stage-row button.active{background:var(--blue);color:#fff}
    .group-title{font-weight:850;color:#1d2939;margin:14px 0 7px;padding-top:5px;border-top:1px solid #eef2f6}
    .table-head,.param{display:grid;grid-template-columns:30px minmax(70px,1fr) minmax(66px,.75fr) 34px minmax(52px,.65fr) minmax(76px,.8fr);gap:6px;align-items:center;min-width:0}
    .table-head{position:sticky;top:0;z-index:2;background:#f8fafc;border:1px solid #e5ebf3;border-radius:12px;padding:8px 6px;margin-bottom:8px;font-size:.8rem;font-weight:850;color:#344054}
    .table-head .toggle-col{cursor:pointer;user-select:none;border-radius:8px;padding:4px 2px;text-align:center}
    .table-head .toggle-col.off{color:#a0aab8;text-decoration:line-through;background:#eef2f6}
    .param{padding:7px 0;border-bottom:1px solid #eef2f6}
    .param input[type="checkbox"]{width:23px;height:23px;accent-color:var(--blue);margin:0}
    .pname{font-weight:780;color:#263445;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .value-input{font-weight:760;text-align:center;min-height:39px!important;padding:7px 6px!important;border-radius:11px!important}
    .flag-cell{text-align:center;font-weight:900;font-size:1.05rem;color:#344054;min-height:1.2em}
    .unit-cell,.range-cell{font-size:.86rem;color:#526070;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border-radius:8px;padding:4px 2px}
    .unit-cell:active,.range-cell:active{background:#eef4fb}
    .col-hidden{visibility:hidden}
    .edit-panel{display:none;grid-column:2/7;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 8px 36px}
    .edit-panel.open{display:grid}
    .edit-panel input{min-height:38px;padding:8px 10px;font-size:.92rem;border-radius:10px}
    .preview-wrap{padding:12px 16px;background:#f7f9fc;border-top:1px solid var(--line)}
    .receipt{width:100%;max-width:360px;margin:0 auto;background:#fff;color:#111;border:1px dashed #98a2b3;padding:12px 12px;font-family:"Courier New",Courier,monospace;font-size:13px;line-height:1.25;overflow-wrap:anywhere}
    .receipt-brand{text-align:center;margin:0 0 4px}
    .receipt-brand img{max-width:120px;max-height:40px;height:auto;width:auto;display:inline-block}
    .receipt pre{font:inherit;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;padding:10px;z-index:50}
    .modal{width:100%;max-width:620px;max-height:92vh;overflow:auto;background:#fff;border-radius:20px;padding:14px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
    .modal h2{margin:0 0 8px;font-size:1.2rem}.modal p{color:var(--muted);margin:0 0 10px}
    .history-item{border-top:1px solid var(--line);padding:10px 0;font-size:.92rem}.history-item b{display:block}
    .muted{color:var(--muted);font-size:.92rem}.hidden{display:none!important}
    @media(max-width:560px){body{padding:8px}.hero{border-radius:14px;padding:7px 8px}.app-logo{width:112px;max-width:38vw}h1{font-size:.92rem}.subtitle{font-size:.72rem}.grid2,.preset-row{grid-template-columns:1fr}.sample-buttons{grid-template-columns:1fr 1fr 1fr}.card{border-radius:16px}.section{padding:10px}.card h2{padding-left:10px}.table-head,.param{grid-template-columns:25px minmax(58px,1fr) 58px 25px 43px 58px;gap:4px}.table-head{font-size:.7rem;padding:7px 4px}.pname{font-size:.88rem}.value-input{font-size:.95rem}.unit-cell,.range-cell{font-size:.74rem}.edit-panel{grid-template-columns:1fr;margin-left:29px}.receipt{font-size:12px;max-width:100%}button{padding:10px 11px}.hero button{min-height:40px;padding:9px 12px}}
    @media print{body{background:#fff;padding:0}.app>*:not(#printOnly){display:none!important}#printOnly{display:block!important}.receipt{border:0;max-width:58mm;width:58mm;font-size:10.5px;padding:0;margin:0}.receipt-brand img{max-width:42mm;max-height:13mm}.no-print{display:none!important}}
  </style>
</head>
<body>
<div class="app">
  <div class="hero">
    <div class="hero-top">
      <a class="brand-link" href="https://resuspro.com" target="_blank" rel="noopener">
        <span class="logo-pill"><img class="app-logo" src="logo.png" alt="ResusPro" onerror="this.closest('.logo-pill').style.display='none'" /></span>
        <div class="brand-text"><h1>BloodGas SimLab</h1><div class="subtitle">Point-of-care simulator</div></div>
      </a>
      <button class="primary" onclick="openOutput()">Print</button>
    </div>
  </div>

  <div class="card">
    <h2>Case details</h2>
    <div class="section">
      <div class="grid2">
        <div><label for="scenarioId">Scenario ID</label><input id="scenarioId" type="text" value="SIM-001" /></div>
        <div><label>Sample type</label><div class="sample-buttons"><button id="sample-Arterial" onclick="setSample('Arterial')">Arterial</button><button id="sample-Venous" onclick="setSample('Venous')">Venous</button><button id="sample-Capillary" onclick="setSample('Capillary')">Capillary</button></div></div>
      </div>
      <div class="preset-row">
        <div><label for="presetSelect">Example scenario</label><select id="presetSelect"><option value="">Select an example...</option></select></div>
        <button class="blue" onclick="loadSelectedPreset()">Load</button>
      </div>
      <div class="stage-row" id="stageRow"></div>
      <div class="btn-row" style="margin-top:12px"><button onclick="selectStandardPanel()">Standard panel</button><button onclick="allParametersOn()">All tests</button><button onclick="fillBlankNormals()">Add normal values</button><button onclick="clearValues()">Clear values</button></div>
      <p class="muted">Example names are for faculty only and are not printed.</p>
    </div>
  </div>

  <div class="card">
    <h2>Parameters</h2>
    <div class="section" id="paramList"></div>
  </div>

  <div class="card">
    <h2>Live print preview</h2>
    <div class="preview-wrap"><div id="receiptPreview" class="receipt"></div></div>
  </div>

  <div class="card">
    <h2>Output history</h2>
    <div class="section"><div class="btn-row"><button onclick="renderHistory()">Refresh</button><button class="danger" onclick="clearHistory()">Clear history</button></div><div id="historyList" style="margin-top:10px"></div></div>
  </div>

  <div id="printOnly" class="hidden"><div id="printReceipt" class="receipt"></div></div>
</div>

<div class="modal-backdrop" id="outputModal">
  <div class="modal">
    <h2>Output</h2>
    <p>Choose where to send or save this simulated result.</p>
    <div class="preview-wrap"><div id="modalReceipt" class="receipt"></div></div>
    <div class="btn-row" style="margin-top:12px">
      <button class="blue" onclick="doPrint('printer')">Local printer</button>
      <button onclick="doPrint('pdf')">Save as PDF</button>
      <button onclick="copyReceipt()">Copy</button>
      <button onclick="closeOutput()">Close</button>
    </div>
    <p class="muted" style="margin-top:10px">For PDF, choose “Save as PDF” in your browser print dialog if available.</p>
  </div>
</div>

<script>
const standardIds=['pH','pCO2','pO2','HCO3','BE','SaO2','Lactate','Na','K','Cl','iCa','Glucose','Hb'];
const columnState={flags:true,units:true,ranges:false};
let sampleType='Arterial'; let currentPreset=''; let currentStage='T0';

const parameterDefs=[
 {group:'Blood gas', id:'pH', name:'pH', unit:'', standard:true, ranges:{Arterial:[7.35,7.45,'7.40'],Venous:[7.31,7.41,'7.36'],Capillary:[7.35,7.45,'7.40']}},
 {group:'Blood gas', id:'pCO2', name:'pCO₂', unit:'kPa', standard:true, ranges:{Arterial:[4.7,6.0,'5.3'],Venous:[5.0,6.8,'5.8'],Capillary:[4.7,6.0,'5.3']}},
 {group:'Blood gas', id:'pO2', name:'pO₂', unit:'kPa', standard:true, ranges:{Arterial:[10.0,13.3,'12.0'],Venous:[4.0,6.0,'5.0'],Capillary:[8.0,12.0,'10.0']}},
 {group:'Blood gas', id:'HCO3', name:'HCO₃⁻', unit:'mmol/L', standard:true, ranges:{Arterial:[22,28,'24'],Venous:[23,29,'25'],Capillary:[22,28,'24']}},
 {group:'Blood gas', id:'BE', name:'BE', unit:'mmol/L', standard:true, ranges:{Arterial:[-2,2,'0'],Venous:[-2,3,'0'],Capillary:[-2,2,'0']}},
 {group:'Blood gas', id:'SaO2', name:'SaO₂', unit:'%', standard:true, ranges:{Arterial:[94,100,'98'],Venous:[60,85,'75'],Capillary:[92,100,'97']}},
 {group:'Blood gas', id:'Lactate', name:'Lactate', unit:'mmol/L', standard:true, ranges:{Arterial:[0.5,2.2,'1.0'],Venous:[0.5,2.2,'1.0'],Capillary:[0.5,2.2,'1.0']}},
 {group:'Electrolytes / renal', id:'Na', name:'Na⁺', unit:'mmol/L', standard:true, ranges:{Arterial:[135,145,'140'],Venous:[135,145,'140'],Capillary:[135,145,'140']}},
 {group:'Electrolytes / renal', id:'K', name:'K⁺', unit:'mmol/L', standard:true, ranges:{Arterial:[3.5,5.3,'4.2'],Venous:[3.5,5.3,'4.2'],Capillary:[3.5,5.3,'4.2']}},
 {group:'Electrolytes / renal', id:'Cl', name:'Cl⁻', unit:'mmol/L', standard:true, ranges:{Arterial:[98,107,'103'],Venous:[98,107,'103'],Capillary:[98,107,'103']}},
 {group:'Electrolytes / renal', id:'iCa', name:'Ca²⁺', unit:'mmol/L', standard:true, ranges:{Arterial:[1.12,1.32,'1.20'],Venous:[1.12,1.32,'1.20'],Capillary:[1.12,1.32,'1.20']}},
 {group:'Electrolytes / renal', id:'Glucose', name:'Glucose', unit:'mmol/L', standard:true, ranges:{Arterial:[4.0,7.8,'5.6'],Venous:[4.0,7.8,'5.6'],Capillary:[4.0,7.8,'5.6']}},
 {group:'Electrolytes / renal', id:'Urea', name:'Urea', unit:'mmol/L', standard:false, ranges:{Arterial:[2.5,7.8,'5.0'],Venous:[2.5,7.8,'5.0'],Capillary:[2.5,7.8,'5.0']}},
 {group:'Electrolytes / renal', id:'Creatinine', name:'Creatinine', unit:'µmol/L', standard:false, ranges:{Arterial:[60,110,'80'],Venous:[60,110,'80'],Capillary:[60,110,'80']}},
 {group:'Electrolytes / renal', id:'eGFR', name:'eGFR', unit:'mL/min', standard:false, ranges:{Arterial:[60,999,'90'],Venous:[60,999,'90'],Capillary:[60,999,'90']}},
 {group:'Haematology / oxygenation', id:'Hb', name:'Hb', unit:'g/L', standard:true, ranges:{Arterial:[130,170,'145'],Venous:[130,170,'145'],Capillary:[130,170,'145']}},
 {group:'Haematology / oxygenation', id:'Hct', name:'Hct', unit:'L/L', standard:false, ranges:{Arterial:[0.40,0.52,'0.44'],Venous:[0.40,0.52,'0.44'],Capillary:[0.40,0.52,'0.44']}},
 {group:'Haematology / oxygenation', id:'COHb', name:'COHb', unit:'%', standard:false, ranges:{Arterial:[0,2,'1.0'],Venous:[0,2,'1.0'],Capillary:[0,2,'1.0']}},
 {group:'Haematology / oxygenation', id:'MetHb', name:'MetHb', unit:'%', standard:false, ranges:{Arterial:[0,1.5,'0.5'],Venous:[0,1.5,'0.5'],Capillary:[0,1.5,'0.5']}},
 {group:'POCT chemistry', id:'CRP', name:'CRP', unit:'mg/L', standard:false, ranges:{Arterial:[0,5,'2'],Venous:[0,5,'2'],Capillary:[0,5,'2']}},
 {group:'POCT chemistry', id:'Ketones', name:'Ketones', unit:'mmol/L', standard:false, ranges:{Arterial:[0,0.6,'0.2'],Venous:[0,0.6,'0.2'],Capillary:[0,0.6,'0.2']}},
 {group:'POCT chemistry', id:'Troponin', name:'Troponin', unit:'ng/L', standard:false, ranges:{Arterial:[0,14,'6'],Venous:[0,14,'6'],Capillary:[0,14,'6']}},
 {group:'POCT chemistry', id:'BNP', name:'BNP', unit:'ng/L', standard:false, ranges:{Arterial:[0,100,'30'],Venous:[0,100,'30'],Capillary:[0,100,'30']}},
 {group:'POCT chemistry', id:'D-dimer', name:'D-dimer', unit:'ng/mL', standard:false, ranges:{Arterial:[0,500,'250'],Venous:[0,500,'250'],Capillary:[0,500,'250']}},
 {group:'POCT chemistry', id:'INR', name:'INR', unit:'', standard:false, ranges:{Arterial:[0.8,1.2,'1.0'],Venous:[0.8,1.2,'1.0'],Capillary:[0.8,1.2,'1.0']}}
];
const params=parameterDefs.map(d=>({ ...d, on:d.standard, value:'', unit:d.unit, customRef:'' }));

const presets={
 'DKA':{stages:{'T0':{pH:'7.08',pCO2:'2.9',HCO3:'7',BE:'-20',pO2:'12.0',SaO2:'98',Lactate:'2.8',Glucose:'31',Ketones:'6.8',Na:'132',K:'5.9',Creatinine:'142'},'T60':{pH:'7.18',pCO2:'3.2',HCO3:'11',BE:'-15',pO2:'11.6',SaO2:'97',Lactate:'2.0',Glucose:'23',Ketones:'4.9',Na:'136',K:'4.8',Creatinine:'118'},'T180':{pH:'7.29',pCO2:'3.8',HCO3:'17',BE:'-8',pO2:'12.4',SaO2:'98',Lactate:'1.4',Glucose:'14',Ketones:'2.1',Na:'139',K:'4.0',Creatinine:'94'}}},
 'Type 1 respiratory failure':{stages:{'T0':{pH:'7.43',pCO2:'4.8',pO2:'7.1',HCO3:'24',BE:'0',SaO2:'86',Lactate:'1.2',Na:'140',K:'4.1',Glucose:'6.2',Hb:'142'}}},
 'Type 2 respiratory failure':{stages:{'T0':{pH:'7.24',pCO2:'9.4',pO2:'7.8',HCO3:'30',BE:'4',SaO2:'88',Lactate:'1.8',Na:'139',K:'4.6',Glucose:'7.4',Hb:'156'},'T60':{pH:'7.31',pCO2:'7.8',pO2:'8.4',HCO3:'31',BE:'5',SaO2:'91',Lactate:'1.3',Na:'140',K:'4.4',Glucose:'6.8',Hb:'154'}}},
 'Metabolic acidosis':{stages:{'T0':{pH:'7.18',pCO2:'3.1',pO2:'12.2',HCO3:'10',BE:'-16',SaO2:'98',Lactate:'7.0',Na:'138',K:'5.2',Glucose:'8.1',Creatinine:'128',Hb:'132'}}}
};

function $(id){return document.getElementById(id)}
function currentRange(p){return p.ranges[sampleType] || p.ranges.Arterial}
function rangeText(p){ if(p.customRef) return p.customRef; const r=currentRange(p); return `${r[0]}-${r[1]}`; }
function normalValue(p){ return currentRange(p)[2]; }
function init(){
  setSample('Arterial');
  const sel=$('presetSelect'); Object.keys(presets).forEach(k=>{let o=document.createElement('option');o.value=k;o.textContent=k;sel.appendChild(o)});
  buildParams(); render(); renderHistory();
}
function buildParams(){
 const list=$('paramList'); list.innerHTML='';
 const head=document.createElement('div'); head.className='table-head';
 head.innerHTML=`<div>✓</div><div>Parameter</div><div>Value</div><div id="head-flags" class="toggle-col" onclick="toggleColumn('flags')">↑↓</div><div id="head-units" class="toggle-col" onclick="toggleColumn('units')">Unit</div><div id="head-ranges" class="toggle-col" onclick="toggleColumn('ranges')">Range</div>`;
 list.appendChild(head);
 let last='';
 params.forEach(p=>{
   if(p.group!==last){last=p.group; let d=document.createElement('div'); d.className='group-title'; d.textContent=last; list.appendChild(d)}
   let row=document.createElement('div'); row.className='param'; row.id='row-'+p.id;
   row.innerHTML=`<input type="checkbox" id="on-${p.id}" ${p.on?'checked':''} onchange="updateParam('${p.id}','on',this.checked)">
    <div class="pname">${p.name}</div>
    <input class="value-input" id="val-${p.id}" inputmode="decimal" type="text" placeholder="—" oninput="updateParam('${p.id}','value',this.value)">
    <div class="flag-cell" id="flag-${p.id}"></div>
    <div class="unit-cell" id="unitLabel-${p.id}" onclick="toggleEdit('${p.id}')"></div>
    <div class="range-cell" id="rangeLabel-${p.id}" onclick="toggleEdit('${p.id}')"></div>
    <div class="edit-panel" id="edit-${p.id}"><input id="unit-${p.id}" type="text" value="${p.unit}" aria-label="Unit" oninput="updateParam('${p.id}','unit',this.value)" placeholder="Unit"><input id="ref-${p.id}" type="text" value="${rangeText(p)}" aria-label="Reference range" oninput="updateParam('${p.id}','customRef',this.value)" placeholder="Reference range"></div>`;
   list.appendChild(row);
 });
 updateParamDisplay();
}
function updateParam(id,key,val){
 let p=params.find(x=>x.id===id); if(!p)return;
 p[key]=val;
 if(key==='value' && String(val).trim() && !p.on){p.on=true; const cb=$('on-'+id); if(cb)cb.checked=true;}
 render();
}
function updateParamDisplay(){
 params.forEach(p=>{
   const f=$('flag-'+p.id), u=$('unitLabel-'+p.id), r=$('rangeLabel-'+p.id), refInput=$('ref-'+p.id), unitInput=$('unit-'+p.id);
   if(f){f.textContent=flagFor(p); f.classList.toggle('col-hidden',!columnState.flags)}
   if(u){u.textContent=p.unit || '—'; u.classList.toggle('col-hidden',!columnState.units)}
   if(r){r.textContent=rangeText(p); r.classList.toggle('col-hidden',!columnState.ranges)}
   if(refInput && !p.customRef) refInput.value=rangeText(p);
   if(unitInput) unitInput.value=p.unit;
 });
 ['flags','units','ranges'].forEach(k=>{const el=$('head-'+k); if(el)el.classList.toggle('off',!columnState[k]);});
}
function toggleEdit(id){const el=$('edit-'+id); if(el)el.classList.toggle('open');}
function toggleColumn(k){columnState[k]=!columnState[k]; render();}
function setSample(t){sampleType=t; ['Arterial','Venous','Capillary'].forEach(x=>{const b=$('sample-'+x); if(b)b.classList.toggle('active',x===t)}); render();}
function loadSelectedPreset(){const name=$('presetSelect').value;if(!name)return; currentPreset=name; const stages=Object.keys(presets[name].stages); currentStage=stages[0]; drawStages(); loadStage(currentStage);}
function drawStages(){const row=$('stageRow'); row.innerHTML=''; if(!currentPreset)return; Object.keys(presets[currentPreset].stages).forEach(s=>{let b=document.createElement('button'); b.textContent=s; b.className='small'+(s===currentStage?' active':''); b.onclick=()=>{currentStage=s; loadStage(s); drawStages()}; row.appendChild(b);});}
function loadStage(stage){clearValues(false); selectStandardPanel(false); const data=presets[currentPreset].stages[stage]; Object.entries(data).forEach(([id,val])=>{let p=params.find(x=>x.id===id); if(p){p.value=val;p.on=true; const v=$('val-'+id), c=$('on-'+id); if(v)v.value=val; if(c)c.checked=true;}}); render();}
function fillBlankNormals(){params.forEach(p=>{if(p.on && !String(p.value).trim()){p.value=normalValue(p); const el=$('val-'+p.id); if(el)el.value=p.value;}}); render();}
function selectStandardPanel(doRender=true){params.forEach(p=>{p.on=standardIds.includes(p.id); const cb=$('on-'+p.id); if(cb)cb.checked=p.on;}); if(doRender)render();}
function allParametersOn(){params.forEach(p=>{p.on=true; const cb=$('on-'+p.id); if(cb)cb.checked=true;}); render();}
function clearValues(doRender=true){params.forEach(p=>{p.value=''; const el=$('val-'+p.id); if(el)el.value='';}); if(doRender)render();}
function parseRef(p){let m=String(rangeText(p)).replace(/[–—]/g,'-').match(/(-?\d+(?:\.\d+)?)\s*-\s*(-?\d+(?:\.\d+)?)/); if(m)return [parseFloat(m[1]),parseFloat(m[2])]; const r=currentRange(p); return [parseFloat(r[0]),parseFloat(r[1])];}
function flagFor(p){const v=parseFloat(String(p.value).replace(',','.')); if(Number.isNaN(v))return ''; const [lo,hi]=parseRef(p); if(v<lo)return '↓'; if(v>hi)return '↑'; return '';}
function pad(s,n){s=String(s); return s.length>=n?s.slice(0,n):s+' '.repeat(n-s.length)}
function receiptText(){const lines=[]; const sid=$('scenarioId').value||'SIM'; const now=new Date(); const stamp=now.toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
 lines.push('--------------------------------'); lines.push('POINT OF CARE TESTING'); lines.push('Simulation Mode'); lines.push('--------------------------------'); lines.push('Scenario: '+sid); lines.push('Sample:   '+sampleType); lines.push('Date:     '+stamp); lines.push('--------------------------------');
 let current=''; params.filter(p=>p.on && String(p.value).trim()).forEach(p=>{ if(p.group!==current){current=p.group; lines.push(''); lines.push(p.group.toUpperCase());} const f=columnState.flags?flagFor(p):''; const unit=columnState.units&&p.unit?' '+p.unit:''; const ref=columnState.ranges?' ['+rangeText(p)+']':''; lines.push(pad(p.name,11)+' '+pad(p.value,7)+' '+pad(f,1)+unit+ref); });
 lines.push(''); lines.push('--------------------------------'); lines.push('Generated by ResusPro'); lines.push('resuspro.com'); lines.push('For simulation use only'); lines.push('--------------------------------'); return lines.join('\n');}
function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));}
function receiptHtml(){return '<div class="receipt-brand"><img src="logo.png" alt="ResusPro" onerror="this.style.display=\'none\'"></div><pre>'+esc(receiptText())+'</pre>';}
function render(){updateParamDisplay(); const html=receiptHtml(); $('receiptPreview').innerHTML=html; $('modalReceipt').innerHTML=html; $('printReceipt').innerHTML=html;}
function openOutput(){render(); $('outputModal').style.display='flex';}
function closeOutput(){ $('outputModal').style.display='none';}
function saveHistory(mode){const item={time:new Date().toISOString(),mode,scenario:$('scenarioId').value||'',sample:sampleType,text:receiptText()}; const arr=JSON.parse(localStorage.getItem('resusproBloodGasHistory')||'[]'); arr.unshift(item); localStorage.setItem('resusproBloodGasHistory',JSON.stringify(arr.slice(0,100))); renderHistory();}
function doPrint(mode){saveHistory(mode); closeOutput(); setTimeout(()=>window.print(),100);}
async function copyReceipt(){const txt=receiptText(); try{await navigator.clipboard.writeText(txt);}catch(e){alert(txt)} saveHistory('copy'); closeOutput();}
function renderHistory(){const el=$('historyList'); const arr=JSON.parse(localStorage.getItem('resusproBloodGasHistory')||'[]'); if(!arr.length){el.innerHTML='<p class="muted">No outputs saved yet. Printing, PDF export, or copy will save automatically on this device.</p>';return;} el.innerHTML=arr.slice(0,20).map((h,i)=>`<div class="history-item"><b>${new Date(h.time).toLocaleString('en-GB')} · ${h.mode}</b><span class="muted">${h.scenario||'SIM'} · ${h.sample}</span><div class="btn-row" style="margin-top:6px"><button class="small" onclick="loadHistory(${i})">Load text</button></div></div>`).join('');}
function loadHistory(i){const arr=JSON.parse(localStorage.getItem('resusproBloodGasHistory')||'[]'); if(arr[i]){ $('receiptPreview').textContent=arr[i].text; window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});} }
function clearHistory(){if(confirm('Clear saved output history on this device?')){localStorage.removeItem('resusproBloodGasHistory');renderHistory();}}
document.addEventListener('input',e=>{if(e.target.id==='scenarioId')render();});
init();
</script>
</body>
</html>
