<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1565c0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BloodGas">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="application-name" content="BloodGas SimLab">
  <meta name="description" content="ResusPro BloodGas point-of-care simulation result generator.">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="pwa-icon-192.png">
  <title>ResusPro BloodGas</title>
  <!-- ResusPro BloodGas v1.0.7 — 1-bit monochrome PNG + reliable PWA updating -->
  <style>
    :root{
      --blue:#1565c0;--blue2:#0d47a1;--bg:#eef2f6;--card:#fff;--line:#d9e1ea;
      --text:#101828;--muted:#526070;--soft:#e8eef5;--danger:#b42318;
      --green:#18864b;--amber:#e59b16;--red:#c62828;--shadow:0 2px 12px rgba(16,24,40,.08)
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;padding:0;width:100%;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
    body{padding:10px 10px 28px}
    .app{width:100%;max-width:900px;margin:0 auto}
    .hero{background:linear-gradient(135deg,var(--blue),#1976d2);color:#fff;border-radius:16px;padding:8px 10px;margin:0 0 10px;box-shadow:var(--shadow)}
    .hero-top{display:flex;gap:10px;align-items:center;justify-content:space-between;min-width:0}
    .brand{display:flex;align-items:center;gap:9px;min-width:0}
    .logo-pill{background:rgba(255,255,255,.95);border-radius:13px;padding:5px 8px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 5px rgba(16,24,40,.18);flex:0 0 auto}
    .app-logo{width:128px;max-width:39vw;height:auto;display:block}
    .brand-text{min-width:0}.brand-text h1{font-size:1rem;line-height:1.05;margin:0;font-weight:850;letter-spacing:.2px;white-space:normal}
    .subtitle{font-size:.76rem;margin-top:2px;opacity:.96;line-height:1.15}.subtitle a{color:#90caf9;text-decoration:underline;font:inherit;font-weight:700}
    .hero-actions{display:flex;align-items:center;gap:7px;flex:0 0 auto}
    button,select,input{font:inherit}
    button{border:0;border-radius:14px;padding:12px 14px;font-weight:760;background:var(--soft);color:var(--text);cursor:pointer;min-height:44px}
    button:disabled{opacity:.68;cursor:wait}
    button.primary{background:#fff;color:var(--blue2)}button.blue{background:var(--blue);color:#fff}button.small{padding:9px 11px;min-height:38px;border-radius:12px;font-size:.92rem}button.danger{background:#fee4e2;color:var(--danger)}
    .settings-button{width:42px;min-width:42px;padding:0;background:rgba(255,255,255,.18);color:#fff;font-size:1.25rem}
    .print-button{min-width:104px;color:#fff;transition:background .2s ease}.print-button.state-idle{background:var(--green)}.print-button.state-printing{background:var(--amber);color:#1f2937}.print-button.state-offline{background:var(--red)}.print-button.state-checking{background:#fff;color:var(--blue2)}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;margin:12px 0;box-shadow:var(--shadow);overflow:hidden}
    .card h2{font-size:1.12rem;margin:0;padding:14px 16px 8px}.section{padding:12px 16px;border-top:1px solid var(--line)}
    label{display:block;font-weight:720;color:#344054;margin:10px 0 6px;font-size:.95rem}
    input[type="text"],select{width:100%;border:1px solid #cfd8e3;border-radius:14px;background:#fff;padding:12px 13px;min-height:46px;color:var(--text);font-size:1rem}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sample-buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.sample-buttons button{background:var(--soft);font-size:.94rem;padding:10px 8px}.sample-buttons button.active{background:var(--blue);color:#fff}
    .stage-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.stage-row button.active{background:var(--blue);color:#fff}
    .btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.group-title{font-weight:850;color:#1d2939;margin:16px 0 7px;padding-top:6px;border-top:1px solid #eef2f6}
    .param-head,.param{display:grid;grid-template-columns:34px minmax(78px,1.2fr) minmax(76px,.9fr) 30px minmax(54px,.65fr) minmax(74px,.9fr);gap:6px;align-items:center;min-width:0}
    .param-head{position:sticky;top:0;background:#fff;z-index:2;border-bottom:2px solid var(--line);padding:8px 0 7px;font-size:.78rem;font-weight:850;color:#344054}
    .param{padding:7px 0;border-bottom:1px solid #eef2f6}.param input[type="checkbox"]{width:23px;height:23px;accent-color:var(--blue);justify-self:center}
    .head-cell{border:0;background:transparent;color:#344054;border-radius:9px;min-height:30px;padding:4px;font-size:.78rem;font-weight:850;text-align:left;cursor:pointer}.head-cell.center{text-align:center}.head-cell.off{color:#b8c0cc;text-decoration:line-through}.head-cell.include{font-size:1rem;text-align:center;color:var(--blue)}
    .pname{font-weight:780;color:#263445;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.95rem}.value-input{font-weight:760;text-align:center;padding:9px 8px!important;min-height:38px!important;border-radius:11px!important}
    .flag-cell{text-align:center;font-weight:900;color:#344054;min-height:1.2em}.unit-cell,.range-cell{font-size:.84rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.unit-cell.off,.range-cell.off,.flag-cell.off{visibility:hidden}
    .edit-panel{display:none;grid-column:2/7;grid-template-columns:1fr 1fr;gap:8px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:8px;margin-top:4px}.edit-panel.open{display:grid}.edit-panel input{min-height:38px;padding:8px 10px;font-size:.92rem;border-radius:10px}
    .muted{color:var(--muted);font-size:.92rem}.status-strip{display:flex;align-items:center;gap:8px;margin-top:10px;padding:9px 11px;border-radius:12px;background:#f8fafc;border:1px solid #e4e7ec;font-size:.9rem}.status-dot{width:11px;height:11px;border-radius:50%;background:#98a2b3;flex:0 0 auto}.status-dot.idle{background:var(--green)}.status-dot.printing{background:var(--amber)}.status-dot.offline{background:var(--red)}
    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.54);display:none;align-items:flex-end;justify-content:center;padding:10px;z-index:50}.modal-backdrop.open{display:flex}.modal{width:100%;max-width:680px;max-height:94vh;overflow:auto;background:#fff;border-radius:20px;padding:14px;box-shadow:0 20px 50px rgba(0,0,0,.25)}.modal h2{margin:0 0 8px;font-size:1.2rem}.modal h3{font-size:1rem;margin:18px 0 8px}.modal p{color:var(--muted);margin:0 0 10px}
    .receipt{width:100%;max-width:390px;margin:0 auto;background:#fff;color:#111;border:1px dashed #98a2b3;padding:12px;font-family:"Courier New",Courier,monospace;font-size:13px;line-height:1.25;overflow-wrap:anywhere}.receipt-brand{text-align:center;margin:0 0 5px}.receipt-brand img{max-width:150px;max-height:48px;width:auto;height:auto}.receipt pre{font:inherit;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
    .preview-wrap{padding:12px;background:#f7f9fc;border:1px solid var(--line);border-radius:14px}.history-item{border-top:1px solid var(--line);padding:10px 0;font-size:.92rem}.history-item b{display:block}.hidden{display:none!important}
    .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#101828;color:#fff;padding:11px 15px;border-radius:13px;box-shadow:0 8px 30px rgba(0,0,0,.25);z-index:100;max-width:calc(100vw - 24px);text-align:center;font-weight:700;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.toast.error{background:#b42318}.toast.success{background:#166534}
    @media(max-width:560px){body{padding:8px}.hero{border-radius:14px;padding:8px 9px}.app-logo{width:110px;max-width:35vw}.brand{gap:7px}.brand-text h1{font-size:.92rem}.subtitle{font-size:.7rem}.hero-actions{gap:5px}.settings-button{width:39px;min-width:39px}.print-button{min-width:88px;padding:9px 10px}.grid2{grid-template-columns:1fr}.card{border-radius:16px}.param-head,.param{grid-template-columns:30px minmax(58px,1fr) minmax(58px,.8fr) 22px minmax(42px,.55fr) minmax(58px,.7fr);gap:4px}.pname{font-size:.86rem}.unit-cell,.range-cell{font-size:.72rem}.head-cell{font-size:.68rem;padding:2px}.value-input{font-size:.92rem;padding:8px 4px!important}.edit-panel{grid-template-columns:1fr}.receipt{font-size:12px;max-width:100%}button{padding:10px 11px}}
    @media print{body{background:#fff;padding:0}.app,.modal-backdrop,.toast{display:none!important}#printOnly{display:block!important}.receipt{border:0;max-width:58mm;width:58mm;font-size:10.5px;padding:0;margin:0}.receipt-brand img{max-width:42mm;max-height:13mm}}
  </style>
</head>
<body>
<div class="app">
  <header class="hero">
    <div class="hero-top">
      <div class="brand">
        <a class="logo-pill" href="https://resuspro.com" target="_blank" rel="noopener">
          <img class="app-logo" src="logo.png" alt="ResusPro" onerror="this.closest('.logo-pill').style.display='none'">
        </a>
        <div class="brand-text">
          <h1>BloodGas SimLab</h1>
          <div class="subtitle">v1.0.7 | <a href="rotem-dev.html">ROTEM/TEG Dev →</a></div>
        </div>
      </div>
      <div class="hero-actions">
        <button class="settings-button" type="button" onclick="openSettings()" aria-label="Settings">⚙</button>
        <button id="cloudPrintButton" class="print-button state-checking" type="button" onclick="cloudPrint()">Checking…</button>
      </div>
    </div>
  </header>

  <section class="card">
    <h2>Case details</h2>
    <div class="section">
      <div class="grid2">
        <div>
          <label for="patientId">Patient / scenario ID</label>
          <input id="patientId" type="text" value="SIM-001" autocomplete="off">
        </div>
        <div>
          <label for="resusBay">Resus bay / location</label>
          <input id="resusBay" type="text" value="Resus Bay 1" autocomplete="off">
        </div>
      </div>
      <label>Sample type</label>
      <div class="sample-buttons">
        <button id="sample-Arterial" type="button" onclick="setSample('Arterial')">Arterial</button>
        <button id="sample-Venous" type="button" onclick="setSample('Venous')">Venous</button>
        <button id="sample-Capillary" type="button" onclick="setSample('Capillary')">Capillary</button>
      </div>
      <label for="presetSelect">Example scenario</label>
      <select id="presetSelect" onchange="loadSelectedPreset()"><option value="">Select an example…</option></select>
      <div class="stage-row" id="stageRow"></div>
      <div class="btn-row" style="margin-top:12px">
        <button type="button" onclick="fillBlankNormals()">Add normal values</button>
        <button type="button" onclick="clearValues()">Clear values</button>
      </div>
      <div class="status-strip">
        <span id="printerStatusDot" class="status-dot"></span>
        <span id="printerStatusText">Checking ResusPro BloodGas printer…</span>
      </div>
      </section>

  <section class="card">
    <h2>Parameters</h2>
    <div class="section" id="paramList"></div>
  </section>
</div>

<div id="settingsModal" class="modal-backdrop" onclick="backdropClose(event,'settingsModal')">
  <div class="modal">
    <div class="btn-row" style="justify-content:space-between">
      <h2>Output & printer</h2>
      <button class="small" type="button" onclick="closeSettings()">Close</button>
    </div>
    <p>Cloud printing is one tap from the green/amber/red button on the home page.</p>
    <div id="settingsPrinterStatus" class="status-strip"><span class="status-dot"></span><span>Checking…</span></div>
    <div class="btn-row" style="margin-top:10px">
      <button class="blue" type="button" onclick="refreshPrinterStatus(true)">Refresh status</button>
      <button type="button" onclick="sendTestPrint()">Test CloudPRNT</button>
      <button type="button" onclick="localPrint('printer')">Local print</button>
      <button type="button" onclick="localPrint('pdf')">Save as PDF</button>
      <button type="button" onclick="copyReceipt()">Copy</button>
    </div>
    <h3>Receipt preview</h3>
    <div class="preview-wrap"><div id="settingsReceipt" class="receipt"></div></div>
    <h3>Output history</h3>
    <div class="btn-row"><button class="small" type="button" onclick="renderHistory()">Refresh</button><button class="small danger" type="button" onclick="clearHistory()">Clear history</button></div>
    <div id="historyList"></div>
  </div>
</div>

<div id="printOnly" class="hidden"><div id="printReceipt" class="receipt"></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
const PRINT_API='https://resuspro-bloodgas-print.dr-nick.workers.dev';
const STANDARD_IDS=['pH','pCO2','pO2','HCO3','BE','SaO2','Lactate','Na','K','Cl','iCa','Glucose','Hb'];
const sampleRanges={
  Arterial:{pH:[7.35,7.45,'7.40'],pCO2:[4.7,6.0,'5.3'],pO2:[10.0,13.3,'12.0'],HCO3:[22,28,'24'],BE:[-2,2,'0'],SaO2:[94,100,'98'],Lactate:[0.5,2.2,'1.0']},
  Venous:{pH:[7.31,7.41,'7.36'],pCO2:[5.0,6.8,'5.8'],pO2:[4.0,6.0,'5.0'],HCO3:[23,29,'25'],BE:[-2,2,'0'],SaO2:[60,85,'75'],Lactate:[0.5,2.2,'1.0']},
  Capillary:{pH:[7.35,7.45,'7.40'],pCO2:[4.7,6.5,'5.5'],pO2:[8.0,12.0,'10.0'],HCO3:[22,28,'24'],BE:[-2,2,'0'],SaO2:[92,100,'97'],Lactate:[0.5,2.2,'1.0']}
};
const groups=[
 {name:'Blood gas',items:[['pH','pH','',7.35,7.45,'7.40'],['pCO2','pCO2','kPa',4.7,6.0,'5.3'],['pO2','pO2','kPa',10.0,13.3,'12.0'],['HCO3','HCO3-','mmol/L',22,28,'24'],['BE','BE','mmol/L',-2,2,'0'],['SaO2','SaO2','%',94,100,'98'],['Lactate','Lactate','mmol/L',0.5,2.2,'1.0']]},
 {name:'Electrolytes / renal',items:[['Na','Na+','mmol/L',135,145,'140'],['K','K+','mmol/L',3.5,5.3,'4.2'],['Cl','Cl-','mmol/L',98,107,'103'],['iCa','Ca2+','mmol/L',1.12,1.32,'1.20'],['Glucose','Glucose','mmol/L',4.0,7.8,'5.6'],['Urea','Urea','mmol/L',2.5,7.8,'5.0'],['Creatinine','Creatinine','umol/L',60,110,'80'],['eGFR','eGFR','mL/min',60,999,'90']]},
 {name:'Haematology / oxygenation',items:[['Hb','Hb','g/L',130,170,'145'],['Hct','Hct','L/L',0.40,0.52,'0.44'],['COHb','COHb','%',0,2,'1.0'],['MetHb','MetHb','%',0,1.5,'0.5']]},
 {name:'POCT chemistry',items:[['CRP','CRP','mg/L',0,5,'2'],['Ketones','Ketones','mmol/L',0,0.6,'0.2'],['Troponin','Troponin','ng/L',0,14,'6'],['BNP','BNP','ng/L',0,100,'30'],['D-dimer','D-dimer','ng/mL',0,500,'250'],['INR','INR','',0.8,1.2,'1.0']]}
];
const params=groups.flatMap(group=>group.items.map(item=>({id:item[0],name:item[1],unit:item[2],baseLow:item[3],baseHigh:item[4],baseNormal:item[5],low:item[3],high:item[4],normal:item[5],group:group.name,on:STANDARD_IDS.includes(item[0]),value:'',ref:`${item[3]}-${item[4]}`,customRef:false,customUnit:false})));
const presets={
 'DKA':{stages:{'T0':{pH:'7.08',pCO2:'2.9',HCO3:'7',BE:'-20',Lactate:'2.8',Glucose:'31',Ketones:'6.8',Na:'132',K:'5.9',Creatinine:'142'},'T60':{pH:'7.18',pCO2:'3.2',HCO3:'11',BE:'-15',Lactate:'2.0',Glucose:'23',Ketones:'4.9',Na:'136',K:'4.8',Creatinine:'118'},'T180':{pH:'7.29',pCO2:'3.8',HCO3:'17',BE:'-8',Lactate:'1.4',Glucose:'14',Ketones:'2.1',Na:'139',K:'4.0',Creatinine:'94'}}},
 'Type 1 respiratory failure':{stages:{'T0':{pH:'7.43',pCO2:'4.8',pO2:'7.1',SaO2:'86',HCO3:'24',BE:'0',Lactate:'1.4',Na:'139',K:'4.0',Glucose:'6.0'}}},
 'Type 2 respiratory failure':{stages:{'T0':{pH:'7.24',pCO2:'9.4',pO2:'7.8',SaO2:'88',HCO3:'30',BE:'4',Lactate:'1.6',Na:'140',K:'4.6',Glucose:'7.2'}}},
 'Metabolic acidosis':{stages:{'T0':{pH:'7.18',pCO2:'3.1',pO2:'12.0',HCO3:'10',BE:'-16',Lactate:'7.0',Na:'138',K:'5.1',Glucose:'8.0',Creatinine:'132'}}}
};
let sampleType='Arterial';let currentPreset='';let currentStage='T0';let includeCycleState='standard';let showFlags=true;let showUnits=true;let showRanges=false;let printerState='checking';let statusTimer=null;
const $=id=>document.getElementById(id);
function init(){
  restoreCaseDetails();setSample('Arterial',false);
  const select=$('presetSelect');Object.keys(presets).forEach(name=>{const option=document.createElement('option');option.value=name;option.textContent=name;select.appendChild(option)});
  buildParams();renderReceipt();renderHistory();refreshPrinterStatus();statusTimer=setInterval(()=>refreshPrinterStatus(false),10000);
  $('patientId').addEventListener('input',caseDetailChanged);$('resusBay').addEventListener('input',caseDetailChanged);
}
function restoreCaseDetails(){
  $('patientId').value=localStorage.getItem('bloodgasPatientId')||'SIM-001';
  $('resusBay').value=localStorage.getItem('bloodgasResusBay')||'Resus Bay 1';
}
function caseDetailChanged(){localStorage.setItem('bloodgasPatientId',$('patientId').value);localStorage.setItem('bloodgasResusBay',$('resusBay').value);renderReceipt()}
function buildParams(){
  const list=$('paramList');list.innerHTML='';
  const head=document.createElement('div');head.className='param-head';head.innerHTML='<button class="head-cell include" type="button" onclick="cycleIncludeHeader()" id="includeHead" title="Cycle none, standard, all">✓</button><span class="head-cell">Parameter</span><span class="head-cell">Value</span><button class="head-cell center" type="button" id="flagHead" onclick="toggleColumn(\'flags\')" title="Out-of-range indicator">↑↓</button><button class="head-cell" type="button" id="unitHead" onclick="toggleColumn(\'units\')">Unit</button><button class="head-cell off" type="button" id="rangeHead" onclick="toggleColumn(\'ranges\')">Range</button>';list.appendChild(head);
  let last='';params.forEach(p=>{if(p.group!==last){last=p.group;const title=document.createElement('div');title.className='group-title';title.textContent=last;list.appendChild(title)}const row=document.createElement('div');row.className='param';row.id=`row-${p.id}`;row.innerHTML=`<input type="checkbox" id="on-${p.id}" ${p.on?'checked':''} onchange="updateParam('${p.id}','on',this.checked)"><div class="pname">${escapeHtml(p.name)}</div><input class="value-input" id="val-${p.id}" inputmode="decimal" type="text" placeholder="—" oninput="updateParam('${p.id}','value',this.value)"><div class="flag-cell" id="flag-${p.id}"></div><div class="unit-cell" id="unitLabel-${p.id}" onclick="toggleEdit('${p.id}')"></div><div class="range-cell" id="rangeLabel-${p.id}" onclick="toggleEdit('${p.id}')"></div><div class="edit-panel" id="edit-${p.id}"><input id="unit-${p.id}" type="text" value="${escapeAttr(p.unit)}" aria-label="Unit" oninput="updateParam('${p.id}','unit',this.value)" placeholder="Unit"><input id="ref-${p.id}" type="text" value="${escapeAttr(p.ref)}" aria-label="Reference range" oninput="updateParam('${p.id}','ref',this.value)" placeholder="Reference range"></div>`;list.appendChild(row)});
  updateParamDisplay();updateColumnHeaders();
}
function updateParamDisplay(){params.forEach(p=>{const on=$(`on-${p.id}`),val=$(`val-${p.id}`),flag=$(`flag-${p.id}`),unit=$(`unitLabel-${p.id}`),range=$(`rangeLabel-${p.id}`),unitInput=$(`unit-${p.id}`),refInput=$(`ref-${p.id}`);if(on)on.checked=p.on;if(val&&val.value!==p.value)val.value=p.value;if(flag){flag.textContent=flagFor(p);flag.classList.toggle('off',!showFlags)}if(unit){unit.textContent=p.unit||'—';unit.classList.toggle('off',!showUnits)}if(range){range.textContent=p.ref;range.classList.toggle('off',!showRanges)}if(unitInput&&unitInput.value!==p.unit)unitInput.value=p.unit;if(refInput&&refInput.value!==p.ref)refInput.value=p.ref})}
function updateParam(id,key,value){const p=params.find(item=>item.id===id);if(!p)return;if(key==='value'){p.value=value;if(String(value).trim()&&!p.on){p.on=true;const box=$(`on-${id}`);if(box)box.checked=true}}else if(key==='on'){p.on=value;includeCycleState='custom';updateIncludeHeader()}else if(key==='unit'){p.unit=value;p.customUnit=true}else if(key==='ref'){p.ref=value;p.customRef=true}updateParamDisplay();renderReceipt()}
function toggleEdit(id){const panel=$(`edit-${id}`);if(panel)panel.classList.toggle('open')}
function toggleColumn(which){if(which==='flags')showFlags=!showFlags;if(which==='units')showUnits=!showUnits;if(which==='ranges')showRanges=!showRanges;updateColumnHeaders();updateParamDisplay();renderReceipt()}
function updateColumnHeaders(){$('flagHead').classList.toggle('off',!showFlags);$('unitHead').classList.toggle('off',!showUnits);$('rangeHead').classList.toggle('off',!showRanges);updateIncludeHeader()}
function updateIncludeHeader(){const head=$('includeHead');if(!head)return;head.textContent=includeCycleState==='none'?'☐':includeCycleState==='all'?'☑':'✓';head.title=`Include: ${includeCycleState}. Tap to cycle none → standard → all`}
function cycleIncludeHeader(){if(includeCycleState==='none'){params.forEach(p=>p.on=STANDARD_IDS.includes(p.id));includeCycleState='standard'}else if(includeCycleState==='standard'){params.forEach(p=>p.on=true);includeCycleState='all'}else{params.forEach(p=>p.on=false);includeCycleState='none'}updateParamDisplay();updateIncludeHeader();renderReceipt()}
function applySampleRanges(){params.forEach(p=>{const range=sampleRanges[sampleType]&&sampleRanges[sampleType][p.id];if(range){p.low=range[0];p.high=range[1];p.normal=range[2];if(!p.customRef)p.ref=`${range[0]}-${range[1]}`}else{p.low=p.baseLow;p.high=p.baseHigh;p.normal=p.baseNormal;if(!p.customRef)p.ref=`${p.baseLow}-${p.baseHigh}`}})}
function setSample(type,doRender=true){sampleType=type;applySampleRanges();['Arterial','Venous','Capillary'].forEach(name=>{const button=$(`sample-${name}`);if(button)button.classList.toggle('active',name===type)});updateParamDisplay();if(doRender)renderReceipt()}
function loadSelectedPreset(){const name=$('presetSelect').value;if(!name){currentPreset='';$('stageRow').innerHTML='';return}currentPreset=name;const stages=Object.keys(presets[name].stages);currentStage=stages[0];drawStages();loadStage(currentStage)}
function drawStages(){const row=$('stageRow');row.innerHTML='';if(!currentPreset)return;Object.keys(presets[currentPreset].stages).forEach(stage=>{const button=document.createElement('button');button.type='button';button.textContent=stage;button.className='small'+(stage===currentStage?' active':'');button.onclick=()=>{currentStage=stage;loadStage(stage);drawStages()};row.appendChild(button)})}
function loadStage(stage){clearValues(false);const data=presets[currentPreset].stages[stage];Object.entries(data).forEach(([id,value])=>{const p=params.find(item=>item.id===id);if(p){p.value=value;p.on=true}});includeCycleState='custom';updateIncludeHeader();updateParamDisplay();renderReceipt()}
function fillBlankNormals(){params.forEach(p=>{if(p.on&&!String(p.value).trim())p.value=p.normal});updateParamDisplay();renderReceipt()}
function clearValues(doRender=true){params.forEach(p=>{p.value=''});updateParamDisplay();if(doRender)renderReceipt()}
function parseRef(p){const match=String(p.ref).replace(/[–—]/g,'-').match(/(-?\d+(?:\.\d+)?)\s*-\s*(-?\d+(?:\.\d+)?)/);return match?[parseFloat(match[1]),parseFloat(match[2])]:[p.low,p.high]}
function flagFor(p){const value=parseFloat(String(p.value).replace(',','.'));if(Number.isNaN(value))return'';const[low,high]=parseRef(p);if(value<low)return'↓';if(value>high)return'↑';return''}
function pad(value,length){const text=String(value);return text.length>=length?text.slice(0,length):text+' '.repeat(length-text.length)}
function receiptLines(){
  const patient=cleanField($('patientId').value)||'SIM';const bay=cleanField($('resusBay').value)||'Not specified';
  const stamp=new Date().toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const lines=['--------------------------------','RESUSPRO','BLOOD GAS - SIMULATION RESULT','--------------------------------','PATIENT / SCENARIO',patient,'RESUS BAY / LOCATION',bay,'--------------------------------',`Sample: ${sampleType}`,`Time:   ${stamp}`,'--------------------------------'];
  let current='';params.filter(p=>p.on&&String(p.value).trim()).forEach(p=>{if(p.group!==current){current=p.group;lines.push('',p.group.toUpperCase())}const flag=showFlags?flagFor(p):'';const unit=showUnits&&p.unit?' '+p.unit:'';const range=showRanges?` [${p.ref}]`:'';lines.push(`${pad(p.name,12)} ${pad(p.value,8)} ${pad(flag,1)}${unit}${range}`)});
  lines.push('','--------------------------------','Generated by ResusPro','resuspro.com','FOR SIMULATION USE ONLY','--------------------------------');return lines
}
function receiptText(){return receiptLines().join('\n')}
function withoutDuplicateTextBrand(lines){return lines.filter((line,index)=>!(index===1&&line==='RESUSPRO'))}
function receiptHtml(){return `<div class="receipt-brand"><img src="logo.png?v=1.0.6" alt="ResusPro" onerror="this.style.display='none'"></div><pre>${escapeHtml(withoutDuplicateTextBrand(receiptLines()).join('\n'))}</pre>`}
function testReceiptLines(){
  const stamp=new Date().toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
  return ['--------------------------------','RESUSPRO','BLOOD GAS - CLOUDPRNT TEST','--------------------------------','PATIENT / SCENARIO','TEST-PATIENT','RESUS BAY / LOCATION','TEST BAY','--------------------------------',`Time:   ${stamp}`,'','Printer connection successful.','For simulation use only.','--------------------------------'];
}
function renderReceipt(){const html=receiptHtml();$('settingsReceipt').innerHTML=html;$('printReceipt').innerHTML=html}
async function cloudPrint(){
  const button=$('cloudPrintButton');button.disabled=true;button.textContent='Queuing…';
  try{
    const png=await buildReceiptPng();
    const response=await fetch(`${PRINT_API}/api/print`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({patientId:cleanField($('patientId').value),resusBay:cleanField($('resusBay').value),receiptText:receiptText(),pngBase64:png.base64,pngHeight:png.height,pngBitDepth:png.bitDepth}),cache:'no-store'});
    const result=await readJsonResponse(response);if(!response.ok||!result.ok)throw new Error(result.error||`Print service returned ${response.status}`);
    saveHistory('CloudPRNT queued',result.jobId);showToast('Result queued for ResusPro BloodGas printer.','success');trackJob(result.jobId);await refreshPrinterStatus(false);
  }catch(error){showToast(`Could not queue print: ${error.message}`,'error')}
  finally{button.disabled=false;applyPrinterState(printerState)}
}
async function sendTestPrint(){
  try{
    const lines=testReceiptLines();
    const png=await buildReceiptPng(lines);
    const response=await fetch(`${PRINT_API}/api/test`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({patientId:'TEST-PATIENT',resusBay:'TEST BAY',receiptText:lines.join('\n'),pngBase64:png.base64,pngHeight:png.height,pngBitDepth:png.bitDepth}),cache:'no-store'});
    const result=await readJsonResponse(response);if(!response.ok||!result.ok)throw new Error(result.error||`Print service returned ${response.status}`);saveHistory('CloudPRNT test queued',result.jobId);showToast('Test receipt queued.','success');trackJob(result.jobId);refreshPrinterStatus(false)
  }catch(error){showToast(`Test print failed: ${error.message}`,'error')}
}
async function trackJob(jobId){
  const started=Date.now();
  while(Date.now()-started<120000){
    await sleep(2000);
    try{const response=await fetch(`${PRINT_API}/api/job/${encodeURIComponent(jobId)}`,{cache:'no-store'});const job=await readJsonResponse(response);if(!response.ok||!job.ok)continue;if(job.status==='completed'){showToast('Result printed successfully.','success');refreshPrinterStatus(false);return}if(job.status==='failed'){showToast(`Printer rejected the result${job.confirmationCode?`: ${job.confirmationCode}`:''}.`,'error');refreshPrinterStatus(false);return}}catch(_){/* transient status failure */}
  }
}
async function refreshPrinterStatus(showMessage=false){
  try{const response=await fetch(`${PRINT_API}/api/status`,{cache:'no-store'});const status=await readJsonResponse(response);if(!response.ok||!status.ok)throw new Error(status.error||`Status service returned ${response.status}`);printerState=status.state||'offline';applyPrinterState(printerState,status);if(showMessage)showToast(formatStatus(status),status.state==='offline'?'error':'success')}
  catch(error){printerState='offline';applyPrinterState('offline',{label:'Status unavailable',queueDepth:0,lastSeen:null});if(showMessage)showToast(`Printer status unavailable: ${error.message}`,'error')}
}
function applyPrinterState(state,status={}){
  const button=$('cloudPrintButton');button.className=`print-button state-${state}`;
  if(state==='idle')button.textContent='Print';else if(state==='printing')button.textContent='Queue print';else if(state==='offline')button.textContent='Queue offline';else button.textContent='Checking…';
  const dot=$('printerStatusDot');dot.className=`status-dot ${state}`;$('printerStatusText').textContent=formatStatus(status,state);
  const box=$('settingsPrinterStatus');if(box){box.innerHTML=`<span class="status-dot ${state}"></span><span>${escapeHtml(formatStatus(status,state))}</span>`}
}
function formatStatus(status={},fallbackState=printerState){const state=status.state||fallbackState;if(state==='idle')return'ResusPro BloodGas printer: Idle';if(state==='printing'){const count=Number(status.queueDepth||0);return`ResusPro BloodGas printer: ${status.label||'Printing'}${count?` · ${count} queued`:''}`}const seen=status.lastSeen?new Date(status.lastSeen).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'}):'never';return`ResusPro BloodGas printer: ${status.label||'Offline'} · last seen ${seen}`}
async function buildReceiptPng(sourceLines=receiptLines()){
  const lines=withoutDuplicateTextBrand(sourceLines);
  const width=576,margin=24,brandHeight=82,titleGap=10;
  const longest=Math.max(32,...lines.map(line=>String(line).length));
  const fontSize=Math.max(16,Math.min(24,Math.floor((width-(margin*2))/(longest*0.61))));
  const lineHeight=fontSize+5;
  const height=Math.min(1800,margin+brandHeight+titleGap+lines.length*lineHeight+margin);
  const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;
  const ctx=canvas.getContext('2d',{alpha:false});ctx.fillStyle='#fff';ctx.fillRect(0,0,width,height);ctx.fillStyle='#000';
  let y=margin;drawThermalBrand(ctx,width,y);y+=brandHeight+titleGap;
  ctx.font=`${fontSize}px "Courier New", monospace`;ctx.textBaseline='top';
  for(const line of lines){
    if(y+lineHeight>height-margin)break;
    ctx.font=(line==='PATIENT / SCENARIO'||line==='RESUS BAY / LOCATION')?`bold ${fontSize}px "Courier New", monospace`:`${fontSize}px "Courier New", monospace`;
    ctx.fillText(line,margin,y);y+=lineHeight;
  }
  const pngBytes=await encodeMonochromePng(canvas,220);
  return {base64:bytesToBase64(pngBytes),height,width,bitDepth:1};
}
async function encodeMonochromePng(canvas,threshold=220){
  if(typeof CompressionStream!=='function')throw new Error('This browser cannot create the printer-safe monochrome PNG. Please update Chrome or Android System WebView.');
  const width=canvas.width,height=canvas.height,ctx=canvas.getContext('2d',{willReadFrequently:true});
  const rgba=ctx.getImageData(0,0,width,height).data;
  const rowBytes=Math.ceil(width/8),raw=new Uint8Array(height*(rowBytes+1));
  let source=0,target=0;
  for(let y=0;y<height;y++){
    raw[target++]=0;
    for(let byteIndex=0;byteIndex<rowBytes;byteIndex++){
      let packed=0;
      for(let bit=0;bit<8;bit++){
        const x=byteIndex*8+bit;
        let white=1;
        if(x<width){
          const index=source+x*4;
          const alpha=rgba[index+3]/255;
          const luminance=((0.2126*rgba[index])+(0.7152*rgba[index+1])+(0.0722*rgba[index+2]))*alpha+(255*(1-alpha));
          white=luminance>=threshold?1:0;
        }
        packed|=white<<(7-bit);
      }
      raw[target++]=packed;
    }
    source+=width*4;
  }
  const compressedStream=new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate'));
  const compressed=new Uint8Array(await new Response(compressedStream).arrayBuffer());
  const ihdr=new Uint8Array(13);
  writeUint32(ihdr,0,width);writeUint32(ihdr,4,height);
  ihdr[8]=1;ihdr[9]=0;ihdr[10]=0;ihdr[11]=0;ihdr[12]=0;
  return concatBytes(
    new Uint8Array([137,80,78,71,13,10,26,10]),
    pngChunk('IHDR',ihdr),
    pngChunk('IDAT',compressed),
    pngChunk('IEND',new Uint8Array(0)),
  );
}
function pngChunk(type,data){
  const typeBytes=new TextEncoder().encode(type),chunk=new Uint8Array(12+data.length);
  writeUint32(chunk,0,data.length);chunk.set(typeBytes,4);chunk.set(data,8);
  const crcInput=new Uint8Array(typeBytes.length+data.length);crcInput.set(typeBytes);crcInput.set(data,typeBytes.length);
  writeUint32(chunk,8+data.length,crc32(crcInput));return chunk;
}
const CRC32_TABLE=(()=>{const table=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xedb88320^(c>>>1)):(c>>>1);table[n]=c>>>0}return table})();
function crc32(bytes){let c=0xffffffff;for(const byte of bytes)c=CRC32_TABLE[(c^byte)&0xff]^(c>>>8);return(c^0xffffffff)>>>0}
function writeUint32(bytes,offset,value){bytes[offset]=(value>>>24)&255;bytes[offset+1]=(value>>>16)&255;bytes[offset+2]=(value>>>8)&255;bytes[offset+3]=value&255}
function concatBytes(...parts){const total=parts.reduce((sum,part)=>sum+part.length,0),out=new Uint8Array(total);let offset=0;for(const part of parts){out.set(part,offset);offset+=part.length}return out}
function bytesToBase64(bytes){let binary='';const chunk=0x8000;for(let i=0;i<bytes.length;i+=chunk)binary+=String.fromCharCode(...bytes.subarray(i,i+chunk));return btoa(binary)}
function drawThermalBrand(ctx,width,y){
  ctx.save();ctx.fillStyle='#000';ctx.strokeStyle='#000';ctx.lineWidth=3;ctx.textBaseline='alphabetic';ctx.textAlign='left';
  const brand='RESUS PRO';ctx.font='bold 38px Arial, sans-serif';const brandWidth=ctx.measureText(brand).width;const shieldWidth=38;const gap=18;const total=brandWidth+gap+shieldWidth;const x=(width-total)/2;
  ctx.fillText(brand,x,y+40);
  const sx=x+brandWidth+gap,sy=y+8;ctx.beginPath();ctx.moveTo(sx+19,sy);ctx.lineTo(sx+35,sy+7);ctx.lineTo(sx+32,sy+31);ctx.quadraticCurveTo(sx+19,sy+48,sx+6,sy+31);ctx.lineTo(sx+3,sy+7);ctx.closePath();ctx.stroke();
  ctx.beginPath();ctx.moveTo(sx+8,sy+24);ctx.lineTo(sx+14,sy+24);ctx.lineTo(sx+17,sy+17);ctx.lineTo(sx+21,sy+31);ctx.lineTo(sx+24,sy+24);ctx.lineTo(sx+30,sy+24);ctx.stroke();
  ctx.font='15px Arial, sans-serif';ctx.textAlign='center';ctx.fillText('Professional Medical Training',width/2,y+67);ctx.restore();
}
function loadImage(src){return new Promise(resolve=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=()=>resolve(null);image.src=`${src}?v=1.0.7`})}
function localPrint(mode){saveHistory(mode==='pdf'?'PDF/local print':'Local print');renderReceipt();closeSettings();setTimeout(()=>window.print(),100)}
async function copyReceipt(){try{await navigator.clipboard.writeText(receiptText());saveHistory('Copied');showToast('Receipt copied.','success')}catch(error){showToast(`Could not copy: ${error.message}`,'error')}}
function openSettings(){renderReceipt();renderHistory();$('settingsModal').classList.add('open');refreshPrinterStatus(false)}
function closeSettings(){$('settingsModal').classList.remove('open')}
function backdropClose(event,id){if(event.target.id===id)event.target.classList.remove('open')}
function saveHistory(mode,jobId=''){const item={time:new Date().toISOString(),mode,jobId,patientId:cleanField($('patientId').value),resusBay:cleanField($('resusBay').value),sample:sampleType,text:receiptText()};const history=JSON.parse(localStorage.getItem('resusproBloodGasHistory')||'[]');history.unshift(item);localStorage.setItem('resusproBloodGasHistory',JSON.stringify(history.slice(0,100)));renderHistory()}
function renderHistory(){const element=$('historyList');const history=JSON.parse(localStorage.getItem('resusproBloodGasHistory')||'[]');if(!history.length){element.innerHTML='<p class="muted">No outputs saved yet on this device.</p>';return}element.innerHTML=history.slice(0,20).map(item=>`<div class="history-item"><b>${escapeHtml(new Date(item.time).toLocaleString('en-GB'))} · ${escapeHtml(item.mode)}</b><span class="muted">${escapeHtml(item.patientId||'SIM')} · ${escapeHtml(item.resusBay||'Location not set')} · ${escapeHtml(item.sample||'')}</span></div>`).join('')}
function clearHistory(){if(confirm('Clear saved output history on this device?')){localStorage.removeItem('resusproBloodGasHistory');renderHistory()}}
function showToast(message,type=''){const toast=$('toast');toast.textContent=message;toast.className=`toast show ${type}`;clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>{toast.className='toast'},4200)}
function cleanField(value){return String(value||'').replace(/[\r\n\t]+/g,' ').trim().slice(0,80)}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]))}
function escapeAttr(value){return escapeHtml(value)}
function sleep(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
async function readJsonResponse(response){const text=await response.text();try{return JSON.parse(text)}catch(_){return{ok:false,error:text||`HTTP ${response.status}`}}}
if('serviceWorker'in navigator){
  let reloadingForNewWorker=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!reloadingForNewWorker){reloadingForNewWorker=true;window.location.reload()}});
  window.addEventListener('load',async()=>{
    try{
      const registration=await navigator.serviceWorker.register('./service-worker.js?v=1.0.7',{updateViaCache:'none'});
      await registration.update();
      setInterval(()=>registration.update().catch(()=>{}),30*60*1000);
    }catch(error){console.warn('Service worker registration failed',error)}
  });
}
window.addEventListener('beforeunload',()=>{if(statusTimer)clearInterval(statusTimer)});
init();
