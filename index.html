<!DOCTYPE html>
<html lang="en">
<head>

  <title>ResusPro BloodGas</title>
  <!-- ResusPro BloodGas v1.0.11 — temperature and FiO2-adjusted blood-gas ranges -->
  <style>
    :root{

    .hero-top{display:flex;gap:10px;align-items:center;justify-content:space-between;min-width:0}

    .brand-text{min-width:0}.brand-text h1{font-size:1rem;line-height:1.05;margin:0;font-weight:850;letter-spacing:.2px;white-space:normal}

    button.primary{background:#fff;color:var(--blue2)}button.blue{background:var(--blue);color:#fff}button.small{padding:9px 11px;min-height:38px;border-radius:12px;font-size:.92rem}button.danger{background:#fee4e2;color:var(--danger)}

    .param-head{position:sticky;top:var(--param-sticky-top);background:#fff;z-index:25;border-bottom:2px solid var(--line);padding:6px 0;min-height:46px;font-size:.78rem;font-weight:850;color:#344054;box-shadow:0 4px 8px rgba(16,24,40,.06)}
    .param{padding:7px 0;border-bottom:1px solid #eef2f6}.param.off-row .value-input,.param.off-row .unit-cell,.param.off-row .range-cell,.param.off-row .flag-cell{opacity:.55}
    .head-cell{display:flex;align-items:center;justify-content:flex-start;align-self:stretch;border:0;background:transparent;color:#344054;border-radius:9px;min-height:40px;margin:0;padding:0 4px;font-size:.78rem;font-weight:850;line-height:1.15;text-align:left;cursor:pointer}.param-head>*{align-self:stretch}.param-head span.head-cell{cursor:default}.head-cell.center{justify-content:center;text-align:center}.head-cell.active{background:var(--blue);color:#fff;box-shadow:0 1px 4px rgba(21,101,192,.24)}.head-cell.off{background:var(--soft);color:#667085;text-decoration:none}.head-cell.param-mode{justify-content:center;text-align:center;white-space:nowrap;font-size:.76rem}.head-cell.param-mode.active{background:var(--blue);color:#fff}#flagHead{display:inline-flex;flex-direction:row;flex-wrap:nowrap;white-space:nowrap;justify-content:center;font-family:"Arial Black",Arial,sans-serif;font-size:1.05rem;font-weight:950;letter-spacing:0;gap:3px;-webkit-text-stroke:.7px currentColor;text-shadow:.35px 0 currentColor,-.35px 0 currentColor}.flag-cell{font-family:"Arial Black",Arial,sans-serif;font-size:1.3rem;font-weight:950;line-height:1;-webkit-text-stroke:.75px currentColor;text-shadow:.35px 0 currentColor,-.35px 0 currentColor}

    .flag-cell{text-align:center;color:#344054;min-height:1.2em}.unit-cell,.range-cell{font-size:.84rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.unit-cell.off,.range-cell.off,.flag-cell.off{visibility:hidden}
    .edit-panel{display:none;grid-column:1/6;grid-template-columns:1fr 1fr;gap:8px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:8px;margin-top:4px}.edit-panel.open{display:grid}.edit-panel input{min-height:38px;padding:8px 10px;font-size:.92rem;border-radius:10px}
    .muted{color:var(--muted);font-size:.92rem}.status-strip{display:flex;align-items:center;gap:8px;margin-top:10px;padding:9px 11px;border-radius:12px;background:#f8fafc;border:1px solid #e4e7ec;font-size:.9rem}.status-dot{width:11px;height:11px;border-radius:50%;background:#98a2b3;flex:0 0 auto}.status-dot.idle{background:var(--green)}.status-dot.printing{background:var(--amber)}.status-dot.offline{background:var(--red)}
    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.54);display:none;align-items:flex-end;justify-content:center;padding:10px;z-index:50}.modal-backdrop.open{display:flex}.modal{width:100%;max-width:680px;max-height:94vh;overflow:auto;background:#fff;border-radius:20px;padding:14px;box-shadow:0 20px 50px rgba(0,0,0,.25)}.modal h2{margin:0 0 8px;font-size:1.2rem}.modal h3{font-size:1rem;margin:18px 0 8px}.modal p{color:var(--muted);margin:0 0 10px}
    .receipt{width:100%;max-width:390px;margin:0 auto;background:#fff;color:#111;border:1px dashed #98a2b3;padding:12px;font-family:"Courier New",Courier,monospace;font-size:13px;line-height:1.25;overflow-wrap:anywhere}.receipt-brand{text-align:center;margin:0 0 5px}.receipt-brand img{max-width:190px;max-height:60px;width:auto;height:auto}.receipt pre{font:inherit;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
    .preview-wrap{padding:12px;background:#f7f9fc;border:1px solid var(--line);border-radius:14px}.history-item{border-top:1px solid var(--line);padding:10px 0;font-size:.92rem}.history-item b{display:block}.hidden{display:none!important}
    .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#101828;color:#fff;padding:11px 15px;border-radius:13px;box-shadow:0 8px 30px rgba(0,0,0,.25);z-index:100;max-width:calc(100vw - 24px);text-align:center;font-weight:700;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.toast.error{background:#b42318}.toast.success{background:#166534}
    @supports(top:env(safe-area-inset-top)){:root{--hero-fixed-top:calc(env(safe-area-inset-top) + 8px)}}
    @media(max-width:560px){body{padding:8px}.hero{width:calc(100% - 16px);border-radius:14px;padding:8px 9px}.app-logo{width:110px;max-width:35vw}.brand{gap:7px}.brand-text h1{font-size:.92rem}.subtitle{font-size:.7rem}.hero-actions{gap:5px}.settings-button{width:39px;min-width:39px}.print-button{min-width:88px;padding:9px 10px}.grid2{grid-template-columns:1fr}.card{border-radius:16px}.param-head,.param{grid-template-columns:minmax(72px,1.15fr) 58px 44px 45px 60px;gap:4px}.param-toggle{font-size:.79rem;padding:7px 6px;min-height:36px}.unit-cell,.range-cell{font-size:.72rem}.head-cell{font-size:.68rem;padding:0 2px;min-height:38px}#flagHead{font-size:1rem;letter-spacing:0}.flag-cell{font-size:1.2rem}.value-input{font-size:.92rem;padding:8px 4px!important}.edit-panel{grid-template-columns:1fr}.receipt{font-size:12px;max-width:100%}button{padding:10px 11px}}
    @media print{body{background:#fff;padding:0}.app,.modal-backdrop,.toast{display:none!important}#printOnly{display:block!important}.receipt{border:0;max-width:58mm;width:58mm;font-size:10.5px;padding:0;margin:0}.receipt-brand img{max-width:49mm;max-height:16mm}}
  </style>
</head>
<body>
<div class="app">
  <header class="hero">
    <div class="hero-top">
      <div class="brand">
        <a class="logo-pill" href="https://resuspro.com" target="_blank" rel="noopener">
          <img class="app-logo" src="logo.png" alt="ResusPro" onerror="this.closest('.logo-pill').style.display='none'">
        </a>
        <div class="brand-text">
          <h1>BloodGas SimLab</h1>
          <div class="subtitle">v1.0.11 | <a href="rotem-dev.html">ROTEM/TEG Dev →</a></div>
        </div>
      </div>
      <div class="hero-actions">
        <button class="settings-button" type="button" onclick="openSettings()" aria-label="Settings">⚙</button>
        <button id="cloudPrintButton" class="print-button state-checking" type="button" onclick="cloudPrint()">Checking…</button>
      </div>
    </div>
  </header>
  <div class="hero-spacer" id="heroSpacer" aria-hidden="true"></div>

  <section class="card">
    <h2>Case details</h2>
    <div class="section">
      <div class="grid2">
        <div>
          <label for="patientId">Patient / scenario ID <span class="muted">(optional)</span></label>
          <input id="patientId" type="text" value="" placeholder="Leave blank to omit from printout" autocomplete="off">
        </div>
        <div>
          <label for="resusBay">Resus bay / location <span class="muted">(optional)</span></label>
          <input id="resusBay" type="text" value="" placeholder="Leave blank to omit from printout" autocomplete="off">
        </div>
      </div>
      <label>Sample type</label>
      <div class="sample-buttons">
        <button id="sample-Arterial" type="button" onclick="setSample('Arterial')">Arterial</button>
        <button id="sample-Venous" type="button" onclick="setSample('Venous')">Venous</button>
        <button id="sample-Capillary" type="button" onclick="setSample('Capillary')">Capillary</button>
      </div>
      <div class="grid2">
        <div>
          <label for="temperature">Temperature (°C)</label>
          <input id="temperature" type="number" min="15" max="45" step="0.1" value="37.0" inputmode="decimal" oninput="physiologyChanged()" onchange="normalisePhysiologyInputs()">
        </div>
        <div>
          <label for="fio2">FiO₂ (%)</label>
          <input id="fio2" type="number" min="21" max="100" step="1" value="21" inputmode="decimal" oninput="physiologyChanged()" onchange="normalisePhysiologyInputs()">
        </div>
      </div>
      <p id="physiologyNote" class="muted physiology-note"></p>
      <label for="presetSelect">Example scenario</label>
      <select id="presetSelect" onchange="loadSelectedPreset()"><option value="">Select an example…</option></select>
      <div class="stage-row" id="stageRow"></div>
      <div class="btn-row" style="margin-top:12px">
        <button type="button" onclick="fillBlankNormals()">Add normal values</button>
        <button type="button" onclick="clearValues()">Clear values</button>
      </div>
    </div>
  </section>

  <section class="card parameters-card">
    <h2>Parameters</h2>
    <div class="section" id="paramList"></div>
  </section>
</div>

<div id="settingsModal" class="modal-backdrop" onclick="backdropClose(event,'settingsModal')">
  <div class="modal">
    <div class="btn-row" style="justify-content:space-between">
      <h2>Output & printer</h2>
      <button class="small" type="button" onclick="closeSettings()">Close</button>
    </div>
    <p>Cloud printing is one tap from the green/amber/red button on the home page.</p>
    <div id="settingsPrinterStatus" class="status-strip"><span class="status-dot"></span><span>Checking…</span></div>
    <div class="btn-row" style="margin-top:10px">
      <button class="blue" type="button" onclick="refreshPrinterStatus(true)">Refresh status</button>
      <button type="button" onclick="sendTestPrint()">Test CloudPRNT</button>
      <button type="button" onclick="localPrint('printer')">Local print</button>
      <button type="button" onclick="localPrint('pdf')">Save as PDF</button>
      <button type="button" onclick="copyReceipt()">Copy</button>
    </div>
    <h3>Receipt preview</h3>
    <div class="preview-wrap"><div id="settingsReceipt" class="receipt"></div></div>
    <h3>Output history</h3>
    <div class="btn-row"><button class="small" type="button" onclick="renderHistory()">Refresh</button><button class="small danger" type="button" onclick="clearHistory()">Clear history</button></div>
    <div id="historyList"></div>
  </div>
</div>

<div id="printOnly" class="hidden"><div id="printReceipt" class="receipt"></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
const PRINT_API='https://resuspro-bloodgas-print.dr-nick.workers.dev';
const DEFAULT_TEMPERATURE=37;
const DEFAULT_FIO2=21;
const SEA_LEVEL_PRESSURE_KPA=101.325;
const RESPIRATORY_QUOTIENT=0.8;
const MMHG_PER_KPA=7.50061683;
const STANDARD_IDS=['pH','pCO2','pO2','HCO3','BE','SaO2','Lactate','Na','K','Cl','iCa','Glucose','Hb'];
const sampleRanges={
  Arterial:{pH:[7.35,7.45,'7.40'],pCO2:[4.7,6.0,'5.3'],pO2:[10.0,13.3,'12.0'],HCO3:[22,28,'24'],BE:[-2,2,'0'],SaO2:[94,100,'98'],Lactate:[0.5,2.2,'1.0']},
  Venous:{pH:[7.31,7.41,'7.36'],pCO2:[5.0,6.8,'5.8'],pO2:[4.0,6.0,'5.0'],HCO3:[23,29,'25'],BE:[-2,2,'0'],SaO2:[60,85,'75'],Lactate:[0.5,2.2,'1.0']},
  Capillary:{pH:[7.35,7.45,'7.40'],pCO2:[4.7,6.5,'5.5'],pO2:[8.0,12.0,'10.0'],HCO3:[22,28,'24'],BE:[-2,2,'0'],SaO2:[92,100,'97'],Lactate:[0.5,2.2,'1.0']}
};
const groups=[
 {name:'Blood gas',items:[['pH','pH','',7.35,7.45,'7.40'],['pCO2','pCO2','kPa',4.7,6.0,'5.3'],['pO2','pO2','kPa',10.0,13.3,'12.0'],['HCO3','HCO3-','mmol/L',22,28,'24'],['BE','BE','mmol/L',-2,2,'0'],['SaO2','SaO2','%',94,100,'98'],['Lactate','Lactate','mmol/L',0.5,2.2,'1.0']]},
 {name:'Electrolytes / renal',items:[['Na','Na+','mmol/L',135,145,'140'],['K','K+','mmol/L',3.5,5.3,'4.2'],['Cl','Cl-','mmol/L',98,107,'103'],['iCa','Ca2+','mmol/L',1.12,1.32,'1.20'],['Glucose','Glucose','mmol/L',4.0,7.8,'5.6'],['Urea','Urea','mmol/L',2.5,7.8,'5.0'],['Creatinine','Creatinine','umol/L',60,110,'80'],['eGFR','eGFR','mL/min',60,999,'90']]},
 {name:'Haematology / oxygenation',items:[['Hb','Hb','g/L',130,170,'145'],['Hct','Hct','L/L',0.40,0.52,'0.44'],['COHb','COHb','%',0,2,'1.0'],['MetHb','MetHb','%',0,1.5,'0.5']]},
 {name:'POCT chemistry',items:[['CRP','CRP','mg/L',0,5,'2'],['Ketones','Ketones','mmol/L',0,0.6,'0.2'],['Troponin','Troponin','ng/L',0,14,'6'],['BNP','BNP','ng/L',0,100,'30'],['D-dimer','D-dimer','ng/mL',0,500,'250'],['INR','INR','',0.8,1.2,'1.0']]}
];
const params=groups.flatMap(group=>group.items.map(item=>({id:item[0],name:item[1],unit:item[2],baseLow:item[3],baseHigh:item[4],baseNormal:item[5],low:item[3],high:item[4],normal:item[5],group:group.name,on:STANDARD_IDS.includes(item[0]),value:'',ref:`${item[3]}-${item[4]}`,customRef:false,customUnit:false})));
const presets={
 'DKA':{stages:{'T0':{pH:'7.08',pCO2:'2.9',HCO3:'7',BE:'-20',Lactate:'2.8',Glucose:'31',Ketones:'6.8',Na:'132',K:'5.9',Creatinine:'142'},'T60':{pH:'7.18',pCO2:'3.2',HCO3:'11',BE:'-15',Lactate:'2.0',Glucose:'23',Ketones:'4.9',Na:'136',K:'4.8',Creatinine:'118'},'T180':{pH:'7.29',pCO2:'3.8',HCO3:'17',BE:'-8',Lactate:'1.4',Glucose:'14',Ketones:'2.1',Na:'139',K:'4.0',Creatinine:'94'}}},
 'Type 1 respiratory failure':{stages:{'T0':{pH:'7.43',pCO2:'4.8',pO2:'7.1',SaO2:'86',HCO3:'24',BE:'0',Lactate:'1.4',Na:'139',K:'4.0',Glucose:'6.0'}}},
 'Type 2 respiratory failure':{stages:{'T0':{pH:'7.24',pCO2:'9.4',pO2:'7.8',SaO2:'88',HCO3:'30',BE:'4',Lactate:'1.6',Na:'140',K:'4.6',Glucose:'7.2'}}},
 'Metabolic acidosis':{stages:{'T0':{pH:'7.18',pCO2:'3.1',pO2:'12.0',HCO3:'10',BE:'-16',Lactate:'7.0',Na:'138',K:'5.1',Glucose:'8.0',Creatinine:'132'}}}
};
let sampleType='Arterial';let currentPreset='';let currentStage='T0';let includeCycleState='standard';let showFlags=true;let showUnits=true;let showRanges=false;let printerState='checking';let statusTimer=null;
const $=id=>document.getElementById(id);
function init(){
  restoreCaseDetails();normalisePhysiologyInputs(false);setSample('Arterial',false);
  const select=$('presetSelect');Object.keys(presets).forEach(name=>{const option=document.createElement('option');option.value=name;option.textContent=name;select.appendChild(option)});
  buildParams();setupFixedLayout();renderReceipt();renderHistory();refreshPrinterStatus();statusTimer=setInterval(()=>refreshPrinterStatus(false),10000);
  $('patientId').addEventListener('input',caseDetailChanged);$('resusBay').addEventListener('input',caseDetailChanged);
}
function restoreCaseDetails(){
  if(!localStorage.getItem('bloodgasOptionalDetailsMigrated')){
    if(localStorage.getItem('bloodgasPatientId')==='SIM-001')localStorage.removeItem('bloodgasPatientId');
    if(localStorage.getItem('bloodgasResusBay')==='Resus Bay 1')localStorage.removeItem('bloodgasResusBay');
    localStorage.setItem('bloodgasOptionalDetailsMigrated','1');
  }
  $('patientId').value=localStorage.getItem('bloodgasPatientId')||'';
  $('resusBay').value=localStorage.getItem('bloodgasResusBay')||'';
}
function caseDetailChanged(){const patient=cleanField($('patientId').value),bay=cleanField($('resusBay').value);if(patient)localStorage.setItem('bloodgasPatientId',patient);else localStorage.removeItem('bloodgasPatientId');if(bay)localStorage.setItem('bloodgasResusBay',bay);else localStorage.removeItem('bloodgasResusBay');renderReceipt()}
function setupFixedLayout(){const hero=document.querySelector('.hero'),spacer=$('heroSpacer');if(!hero||!spacer)return;const update=()=>{const top=parseFloat(getComputedStyle(hero).top)||0;const height=Math.ceil(hero.getBoundingClientRect().height);document.documentElement.style.setProperty('--hero-space',`${height+Math.max(0,top)+4}px`);document.documentElement.style.setProperty('--param-sticky-top',`${Math.ceil(top+height+8)}px`)};update();window.addEventListener('resize',update,{passive:true});window.addEventListener('orientationchange',update,{passive:true});if('ResizeObserver'in window)new ResizeObserver(update).observe(hero)}

function clampNumber(value,min,max,fallback){const number=Number.parseFloat(String(value).replace(',','.'));return Number.isFinite(number)?Math.min(max,Math.max(min,number)):fallback}
function getTemperature(){return clampNumber($('temperature')?.value,15,45,DEFAULT_TEMPERATURE)}

function correctPhForTemperature(value,temp){return value+(temp-37)*(-0.0147+0.0065*(7.4-value))}

    await sleep(2000);
    try{const response=await fetch(`${PRINT_API}/api/job/${encodeURIComponent(jobId)}`,{cache:'no-store'});const job=await readJsonResponse(response);if(!response.ok||!job.ok)continue;if(job.status==='completed'){showToast('Result printed successfully.','success');refreshPrinterStatus(false);return}if(job.status==='failed'){showToast(`Printer rejected the result${job.confirmationCode?`: ${job.confirmationCode}`:''}.`,'error');refreshPrinterStatus(false);return}}catch(_){/* transient status failure */}

function renderHistory(){const element=$('historyList');const history=JSON.parse(localStorage.getItem('resusproBloodGasHistory')||'[]');if(!history.length){element.innerHTML='<p class="muted">No outputs saved yet on this device.</p>';return}element.innerHTML=history.slice(0,20).map(item=>{const details=[item.patientId,item.resusBay,item.sample].filter(Boolean).join(' · ');return`<div class="history-item"><b>${escapeHtml(new Date(item.time).toLocaleString('en-GB'))} · ${escapeHtml(item.mode)}</b>${details?`<span class="muted">${escapeHtml(details)}</span>`:''}</div>`}).join('')}
function clearHistory(){if(confirm('Clear saved output history on this device?')){localStorage.removeItem('resusproBloodGasHistory');renderHistory()}}
function showToast(message,type=''){const toast=$('toast');toast.textContent=message;toast.className=`toast show ${type}`;clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>{toast.className='toast'},4200)}
function cleanField(value){return String(value||'').replace(/[\r\n\t]+/g,' ').trim().slice(0,80)}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]))}
function escapeAttr(value){return escapeHtml(value)}
function sleep(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
async function readJsonResponse(response){const text=await response.text();try{return JSON.parse(text)}catch(_){return{ok:false,error:text||`HTTP ${response.status}`}}}
if('serviceWorker'in navigator){
  let reloadingForNewWorker=false,lastUpdateCheck=0;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!reloadingForNewWorker){reloadingForNewWorker=true;window.location.reload()}});
  window.addEventListener('load',async()=>{
    try{
      const registration=await navigator.serviceWorker.register('./service-worker.js?v=1.0.11',{updateViaCache:'none'});
      const checkForUpdate=async(force=false)=>{const now=Date.now();if(!force&&now-lastUpdateCheck<60000)return;lastUpdateCheck=now;try{await registration.update()}catch(_){}};
      await checkForUpdate(true);
      setInterval(()=>checkForUpdate(false),5*60*1000);
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkForUpdate(false)});
      window.addEventListener('focus',()=>checkForUpdate(false));
      window.addEventListener('online',()=>checkForUpdate(true));
    }catch(error){console.warn('Service worker registration failed',error)}
  });
}
window.addEventListener('beforeunload',()=>{if(statusTimer)clearInterval(statusTimer)});
init();
