    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.54);display:none;align-items:flex-end;justify-content:center;padding:10px;z-index:50}.modal-backdrop.open{display:flex}.modal{width:100%;max-width:680px;max-height:94vh;overflow:auto;background:#fff;border-radius:20px;padding:14px;box-shadow:0 20px 50px rgba(0,0,0,.25)}.modal h2{margin:0 0 8px;font-size:1.2rem}.modal h3{font-size:1rem;margin:18px 0 8px}.modal p{color:var(--muted);margin:0 0 10px}

    .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#101828;color:#fff;padding:11px 15px;border-radius:13px;box-shadow:0 8px 30px rgba(0,0,0,.25);z-index:100;max-width:calc(100vw - 24px);text-align:center;font-weight:700;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.toast.error{background:#b42318}.toast.success{background:#166534}
    @supports(top:env(safe-area-inset-top)){:root{--hero-fixed-top:calc(env(safe-area-inset-top) + 8px)}}
    @media(max-width:560px){body{padding:8px}.hero{width:calc(100% - 16px);border-radius:14px;padding:8px 9px}.app-logo{width:110px;max-width:35vw}.brand{gap:7px}.brand-text h1{font-size:.92rem}.version{font-size:.7rem}.hero-actions{gap:5px}.settings-button{width:39px;min-width:39px}.print-button{min-width:88px;padding:9px 10px}.grid2,.preset-row{grid-template-columns:1fr}.card{border-radius:16px}.section{padding:10px}.card h2{padding-left:10px}.param-head,.param{grid-template-columns:minmax(72px,1.15fr) 58px 44px 45px 60px;gap:4px}.param-toggle{font-size:.79rem;padding:7px 6px;min-height:36px}.unit-cell,.range-cell{font-size:.72rem}.head-cell{font-size:.68rem;padding:0 2px;min-height:38px}#flagHead,#vFlagHead2{font-size:1.02rem;letter-spacing:0}.flag-cell{font-size:1.18rem}.edit-panel{grid-template-columns:1fr}.receipt{font-size:12px;max-width:100%}button{padding:10px 11px}}

<body>
<div class="app">
  <header class="hero">
    <div class="hero-top">
      <div class="brand">
        <a class="logo-pill" href="https://resuspro.com" target="_blank" rel="noopener">
          <img class="app-logo" src="logo.png" alt="ResusPro" onerror="this.closest('.logo-pill').style.display='none'">
        </a>
        <div class="brand-text">
          <h1>ROTEM/TEG SimLab</h1>
          <div class="version">v1.1.0-dev-rot008d | <a class="dev-link" href="index.html">BloodGas →</a></div>
        </div>
      </div>
      <div class="hero-actions">
        <button class="settings-button" type="button" onclick="openSettings()" aria-label="Settings">⚙</button>
        <button id="cloudPrintButton" class="print-button state-checking" type="button" onclick="cloudPrint()">Checking…</button>
      </div>
    </div>
  </header>
  <div class="hero-spacer" id="heroSpacer" aria-hidden="true"></div>

  <div class="tabs">
    <button id="tab-bloodgas" class="active" type="button" onclick="setMode('bloodgas')">Blood Gas</button>
    <button id="tab-visco" type="button" onclick="setMode('visco')">ROTEM / TEG</button>
  </div>

  <section class="card">
    <h2>Case details</h2>
    <div class="section">
      <div class="grid2">
        <div>
          <label for="patientId">Patient / scenario ID <span class="muted">(optional)</span></label>
          <input id="patientId" type="text" value="" placeholder="Leave blank to omit from printout" autocomplete="off">
        </div>
        <div>
          <label for="resusBay">Resus bay / location <span class="muted">(optional)</span></label>
          <input id="resusBay" type="text" value="" placeholder="Leave blank to omit from printout" autocomplete="off">
        </div>
      </div>
      <div id="sampleBlock">
        <label>Sample type</label>
        <div class="sample-buttons"><button id="sample-Arterial" type="button" onclick="setSample('Arterial')">Arterial</button><button id="sample-Venous" type="button" onclick="setSample('Venous')">Venous</button><button id="sample-Capillary" type="button" onclick="setSample('Capillary')">Capillary</button></div>
        <div class="grid2">
          <div><label for="temperature">Temperature (°C)</label><input id="temperature" type="number" min="15" max="45" step="0.1" value="37.0" inputmode="decimal" oninput="physiologyChanged()" onchange="normalisePhysiologyInputs()"></div>
          <div><label for="fio2">FiO₂ (%)</label><input id="fio2" type="number" min="21" max="100" step="1" value="21" inputmode="decimal" oninput="physiologyChanged()" onchange="normalisePhysiologyInputs()"></div>
        </div>
        <p id="physiologyNote" class="muted physiology-note"></p>
      </div>
      <div id="viscoTypeBlock" class="hidden">
        <label>Result type</label>
        <div class="seg-buttons two"><button id="visco-ROTEM" type="button" onclick="setViscoType('ROTEM')">ROTEM</button><button id="visco-TEG" type="button" onclick="setViscoType('TEG')">TEG</button></div>
      </div>
      <div class="preset-row">
        <div><label id="presetLabel" for="presetSelect">Example scenario</label><select id="presetSelect" onchange="loadSelectedPreset()"><option value="">Select an example…</option></select></div>
      </div>
      <div class="stage-row" id="stageRow"></div>
      <div class="btn-row" style="margin-top:12px"><button type="button" onclick="fillBlankNormals()">Add normal values</button><button type="button" onclick="clearValues()">Clear values</button></div>
    </div>
  </section>

  <section class="card parameters-card" id="bloodgasPanel">
    <h2>Blood gas / POCT parameters</h2>
    <div class="section" id="paramList"></div>
  </section>

  <section class="card parameters-card hidden" id="viscoPanel">
    <h2>ROTEM / TEG result</h2>
    <div class="section">
      <div class="grid2"><div><label for="assaySelect">Assay</label><select id="assaySelect" onchange="setAssay(this.value)"></select></div></div>
      <div class="trace-wrap"><svg id="viscoTrace" viewBox="0 0 420 150" role="img" aria-label="Simulated viscoelastic trace"></svg></div>
      <div id="viscoParamList" style="margin-top:10px"></div>
    </div>
  </section>
</div>

<div id="settingsModal" class="modal-backdrop" onclick="backdropClose(event,'settingsModal')">
  <div class="modal">
    <div class="btn-row" style="justify-content:space-between"><h2>Output & printer</h2><button class="small" type="button" onclick="closeSettings()">Close</button></div>
    <p>Cloud printing is one tap from the green/amber/red button on the home page.</p>
    <div id="settingsPrinterStatus" class="status-strip"><span class="status-dot"></span><span>Checking…</span></div>
    <div class="btn-row" style="margin-top:10px">
      <button class="blue" type="button" onclick="refreshPrinterStatus(true)">Refresh status</button>
      <button type="button" onclick="sendTestPrint()">Test CloudPRNT</button>
      <button type="button" onclick="localPrint('printer')">Local print</button>
      <button type="button" onclick="localPrint('pdf')">Save as PDF</button>
      <button type="button" onclick="copyReceipt()">Copy</button>
    </div>
    <h3>Receipt preview</h3>
    <div class="preview-wrap"><div id="settingsReceipt" class="receipt"></div></div>
    <h3>Output history</h3>
    <div class="btn-row"><button class="small" type="button" onclick="renderHistory()">Refresh</button><button class="small danger" type="button" onclick="clearHistory()">Clear history</button></div>
    <div id="historyList"></div>
  </div>
</div>
<div id="printOnly" class="hidden"><div id="printReceipt" class="receipt"></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
const PRINT_API='https://resuspro-bloodgas-print.dr-nick.workers.dev';
const DEFAULT_TEMPERATURE=37;
const DEFAULT_FIO2=21;
const SEA_LEVEL_PRESSURE_KPA=101.325;
const RESPIRATORY_QUOTIENT=0.8;
const MMHG_PER_KPA=7.50061683;
const STANDARD_IDS=['pH','pCO2','pO2','HCO3','BE','SaO2','Lactate','Na','K','Cl','iCa','Glucose','Hb'];
const sampleRanges={
  Arterial:{pH:[7.35,7.45,'7.40'],pCO2:[4.7,6.0,'5.3'],pO2:[10.0,13.3,'12.0'],HCO3:[22,28,'24'],BE:[-2,2,'0'],SaO2:[94,100,'98'],Lactate:[0.5,2.2,'1.0']},
  Venous:{pH:[7.31,7.41,'7.36'],pCO2:[5.0,6.8,'5.8'],pO2:[4.0,6.0,'5.0'],HCO3:[23,29,'25'],BE:[-2,2,'0'],SaO2:[60,85,'75'],Lactate:[0.5,2.2,'1.0']},
  Capillary:{pH:[7.35,7.45,'7.40'],pCO2:[4.7,6.5,'5.5'],pO2:[8.0,12.0,'10.0'],HCO3:[22,28,'24'],BE:[-2,2,'0'],SaO2:[92,100,'97'],Lactate:[0.5,2.2,'1.0']}
};
const groups=[
 {name:'Blood gas',items:[['pH','pH','',7.35,7.45,'7.40'],['pCO2','pCO₂','kPa',4.7,6.0,'5.3'],['pO2','pO₂','kPa',10.0,13.3,'12.0'],['HCO3','HCO₃⁻','mmol/L',22,28,'24'],['BE','BE','mmol/L',-2,2,'0'],['SaO2','SaO₂','%',94,100,'98'],['Lactate','Lactate','mmol/L',0.5,2.2,'1.0']]},
 {name:'Electrolytes / renal',items:[['Na','Na⁺','mmol/L',135,145,'140'],['K','K⁺','mmol/L',3.5,5.3,'4.2'],['Cl','Cl⁻','mmol/L',98,107,'103'],['iCa','Ca²⁺','mmol/L',1.12,1.32,'1.20'],['Glucose','Glucose','mmol/L',4.0,7.8,'5.6'],['Urea','Urea','mmol/L',2.5,7.8,'5.0'],['Creatinine','Creatinine','µmol/L',60,110,'80'],['eGFR','eGFR','mL/min',60,999,'90']]},
 {name:'Haematology / oxygenation',items:[['Hb','Hb','g/L',130,170,'145'],['Hct','Hct','L/L',0.40,0.52,'0.44'],['COHb','COHb','%',0,2,'1.0'],['MetHb','MetHb','%',0,1.5,'0.5']]},
 {name:'POCT chemistry',items:[['CRP','CRP','mg/L',0,5,'2'],['Ketones','Ketones','mmol/L',0,0.6,'0.2'],['Troponin','Troponin','ng/L',0,14,'6'],['BNP','BNP','ng/L',0,100,'30'],['D-dimer','D-dimer','ng/mL',0,500,'250'],['INR','INR','',0.8,1.2,'1.0'],['GFAP','GFAP','pg/mL',0,30,'12']]}
];
const params=groups.flatMap(g=>g.items.map(i=>({id:i[0],name:i[1],unit:i[2],baseLow:i[3],baseHigh:i[4],baseNormal:i[5],low:i[3],high:i[4],normal:i[5],group:g.name,on:STANDARD_IDS.includes(i[0]),value:'',ref:`${i[3]}-${i[4]}`,customRef:false})));
const bloodPresets={
 'DKA':{stages:{'T0':{pH:'7.08',pCO2:'2.9',HCO3:'7',BE:'-20',Lactate:'2.8',Glucose:'31',Ketones:'6.8',Na:'132',K:'5.9',Creatinine:'142'},'T60':{pH:'7.18',pCO2:'3.2',HCO3:'11',BE:'-15',Lactate:'2.0',Glucose:'23',Ketones:'4.9',Na:'136',K:'4.8',Creatinine:'118'},'T180':{pH:'7.29',pCO2:'3.8',HCO3:'17',BE:'-8',Lactate:'1.4',Glucose:'14',Ketones:'2.1',Na:'139',K:'4.0',Creatinine:'94'}}},

function clampNumber(value,min,max,fallback){const number=Number.parseFloat(String(value).replace(',','.'));return Number.isFinite(number)?Math.min(max,Math.max(min,number)):fallback;}
function getTemperature(){return clampNumber($('temperature')?.value,15,45,DEFAULT_TEMPERATURE);}
function getFiO2Percent(){return clampNumber($('fio2')?.value,21,100,DEFAULT_FIO2);}
function correctPhForTemperature(value,temp){return value+(temp-37)*(-0.0147+0.0065*(7.4-value));}
function correctPco2ForTemperature(value,temp){return value*Math.pow(10,0.019*(temp-37));}
function correctPo2ForTemperature(value,temp){const mmHg=value*MMHG_PER_KPA;const powered=Math.pow(mmHg,3.88);const coefficient=((5.49e-11*powered)+0.071)/((9.72e-9*powered)+2.30);return(mmHg*Math.pow(10,coefficient*(temp-37)))/MMHG_PER_KPA;}
function waterVapourPressureKPa(temp){return(0.045*temp*temp-0.84*temp+16.5)*0.133322368;}
function alveolarOxygenKPa(temp,fio2Fraction,pco2KPa){return Math.max(0,(SEA_LEVEL_PRESSURE_KPA-waterVapourPressureKPa(temp))*fio2Fraction-pco2KPa*(fio2Fraction+(1-fio2Fraction)/RESPIRATORY_QUOTIENT));}
function formatAdjustedValue(id,value){if(id==='pH')return value.toFixed(2);if(id==='pCO2'||id==='pO2')return value.toFixed(1);if(Number.isInteger(value))return String(value);return String(Number(value.toFixed(2)));}
function adjustedBloodGasValue(id,baseValue,temp,fio2Percent){if(id==='pH')return correctPhForTemperature(baseValue,temp);if(id==='pCO2')return correctPco2ForTemperature(baseValue,temp);if(id==='pO2'){if(sampleType==='Arterial'){const baselinePco2=Number(sampleRanges.Arterial.pCO2[2]);const baselineAlveolar=alveolarOxygenKPa(37,0.21,baselinePco2);const currentPco2=correctPco2ForTemperature(baselinePco2,temp);const currentAlveolar=alveolarOxygenKPa(temp,fio2Percent/100,currentPco2);return currentAlveolar*(baseValue/baselineAlveolar);}return correctPo2ForTemperature(baseValue,temp);}return baseValue;}

 <text x="220" y="145" class="${(isLysis||isLowAmp||isDelayed)?'trace-warning':'trace-metric'}">${label}</text>`;
}
function loadSelectedPreset(){const name=$('presetSelect').value; if(!name){currentPreset='';$('stageRow').innerHTML='';return;} currentPreset=name; const p=activePresets()[name]; if(mode==='visco'){setViscoType(p.type||'ROTEM'); if(p.assay)setAssay(p.assay); $('assaySelect').value=assay;} const stages=Object.keys(p.stages); currentStage=stages[0]; drawStages(); loadStage(currentStage);}
function drawStages(){const row=$('stageRow'); row.innerHTML=''; if(!currentPreset)return; Object.keys(activePresets()[currentPreset].stages).forEach(s=>{let b=document.createElement('button');b.textContent=s;b.className='small'+(s===currentStage?' active':'');b.onclick=()=>{currentStage=s;loadStage(s);drawStages()};row.appendChild(b);});}
function loadStage(stage){clearValues(false); const data=activePresets()[currentPreset].stages[stage]; Object.entries(data).forEach(([id,val])=>{if(mode==='bloodgas'){let p=params.find(x=>x.id===id);if(p){p.value=val;p.on=true;}} else {let p=viscoParams.find(x=>x.id===id);if(p){p.value=val;p.on=true;}}}); syncIncludeCycleState(); updateParamDisplay(); updateViscoDisplay(); updateColumnHeaders(); render();}
function fillBlankNormals(){if(mode==='bloodgas'){params.forEach(p=>{if(p.on&&!String(p.value).trim())p.value=p.normal;});updateParamDisplay();} else {viscoParams.forEach(p=>{if(p.on&&!String(p.value).trim())p.value=p.normal;});updateViscoDisplay();} render();}
function clearValues(doRender=true){if(mode==='bloodgas'){params.forEach(p=>p.value='');updateParamDisplay();} else {viscoParams.forEach(p=>p.value='');updateViscoDisplay();} if(doRender)render();}
function parseRef(p){let m=String(p.ref).replace(/[–—]/g,'-').match(/(-?\d+(?:\.\d+)?)\s*-\s*(-?\d+(?:\.\d+)?)/);return m?[parseFloat(m[1]),parseFloat(m[2])]:[p.low,p.high];}
function flagFor(p){const v=parseFloat(String(p.value).replace(',','.'));if(Number.isNaN(v))return '';const [lo,hi]=parseRef(p);if(v<lo)return '↓';if(v>hi)return '↑';return '';}
function pad(s,n){s=String(s);return s.length>=n?s.slice(0,n):s+' '.repeat(n-s.length)}
function receiptText(){return receiptLines().join('\n');}
function receiptLines(){return mode==='bloodgas'?bloodReceiptLines():viscoReceiptLines();}
function commonHeader(lines,title){const patient=cleanField($('patientId').value),bay=cleanField($('resusBay').value);const stamp=new Date().toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});lines.push('--------------------------------','RESUSPRO',title,'--------------------------------');if(patient)lines.push('PATIENT / SCENARIO',patient);if(bay)lines.push('RESUS BAY / LOCATION',bay);if(patient||bay)lines.push('--------------------------------');lines.push('Time:   '+stamp,'--------------------------------');}
function commonFooter(lines){lines.push('','--------------------------------','Generated by ResusPro','resuspro.com','FOR SIMULATION USE ONLY','--------------------------------');}
function bloodReceiptLines(){const lines=[];commonHeader(lines,'BLOOD GAS - SIMULATION RESULT');lines.push('Sample: '+sampleType,`Temp: ${getTemperature().toFixed(1)} C   FiO2: ${Math.round(getFiO2Percent())}%`,'--------------------------------');let current='';params.filter(p=>p.on&&String(p.value).trim()).forEach(p=>{if(p.group!==current){current=p.group;lines.push('',p.group.toUpperCase())}const f=showFlags?flagFor(p):'';const unit=showUnits&&p.unit?' '+normalisePrintText(p.unit):'';const ref=showRanges?' ['+normalisePrintText(p.ref)+']':'';lines.push(pad(normalisePrintText(p.name),12)+' '+pad(p.value,8)+' '+pad(f,1)+unit+ref)});commonFooter(lines);return lines;}
function viscoReceiptLines(){const lines=[];commonHeader(lines,viscoType+' VISCOELASTIC RESULT');lines.push('System: '+viscoType,'Assay:  '+assay,'--------------------------------');let hasHeading=false;viscoParams.filter(p=>p.on&&String(p.value).trim()).forEach(p=>{if(!hasHeading){lines.push('PARAMETERS');hasHeading=true}const f=viscoShowFlags?flagFor(p):'';const unit=viscoShowUnits&&p.unit?' '+normalisePrintText(p.unit):'';const ref=viscoShowRanges?' ['+normalisePrintText(p.ref)+']':'';lines.push(pad(normalisePrintText(p.name),14)+' '+pad(p.value,7)+' '+pad(f,1)+unit+ref)});lines.push('','Trace: simulated preview only');commonFooter(lines);return lines;}
function normalisePrintText(value){return String(value).replaceAll('₂','2').replaceAll('₃','3').replaceAll('⁻','-').replaceAll('⁺','+').replaceAll('²','2').replaceAll('µ','u').replaceAll('°','deg');}
function withoutDuplicateTextBrand(lines){return lines.filter((line,index)=>!(index===1&&line==='RESUSPRO'));}
function esc(s){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]));}
function receiptHtml(){return '<div class="receipt-brand"><img src="logo.png?v=1.1.0-dev-rot008d" alt="ResusPro" onerror="this.style.display=\'none\'"></div><pre>'+esc(withoutDuplicateTextBrand(receiptLines()).join('\n'))+'</pre>';}
function render(){const html=receiptHtml();const settings=$('settingsReceipt'),print=$('printReceipt');if(settings)settings.innerHTML=html;if(print)print.innerHTML=html;}
async function cloudPrint(){const button=$('cloudPrintButton');button.disabled=true;button.textContent='Queuing…';try{const png=await buildReceiptPng();const response=await fetch(`${PRINT_API}/api/print`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({patientId:cleanField($('patientId').value),resusBay:cleanField($('resusBay').value),receiptText:receiptText(),pngBase64:png.base64,pngHeight:png.height,pngBitDepth:png.bitDepth}),cache:'no-store'});const result=await readJsonResponse(response);if(!response.ok||!result.ok)throw new Error(result.error||`Print service returned ${response.status}`);saveHistory('CloudPRNT queued',result.jobId);showToast('Result queued for ResusPro printer.','success');trackJob(result.jobId);await refreshPrinterStatus(false)}catch(error){showToast(`Could not queue print: ${error.message}`,'error')}finally{button.disabled=false;applyPrinterState(printerState)}}
async function sendTestPrint(){try{const lines=['--------------------------------','RESUSPRO','ROTEM / TEG CLOUDPRNT TEST','--------------------------------','Printer connection successful.','For simulation use only.','--------------------------------'];const png=await buildReceiptPng(lines);const response=await fetch(`${PRINT_API}/api/test`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({patientId:'',resusBay:'',receiptText:lines.join('\n'),pngBase64:png.base64,pngHeight:png.height,pngBitDepth:png.bitDepth}),cache:'no-store'});const result=await readJsonResponse(response);if(!response.ok||!result.ok)throw new Error(result.error||`Print service returned ${response.status}`);saveHistory('CloudPRNT test queued',result.jobId);showToast('Test receipt queued.','success');trackJob(result.jobId);refreshPrinterStatus(false)}catch(error){showToast(`Test print failed: ${error.message}`,'error')}}
async function trackJob(jobId){const started=Date.now();while(Date.now()-started<120000){await sleep(2000);try{const response=await fetch(`${PRINT_API}/api/job/${encodeURIComponent(jobId)}`,{cache:'no-store'});const job=await readJsonResponse(response);if(!response.ok||!job.ok)continue;if(job.status==='completed'){showToast('Result printed successfully.','success');refreshPrinterStatus(false);return}if(job.status==='failed'){showToast(`Printer rejected the result${job.confirmationCode?`: ${job.confirmationCode}`:''}.`,'error');refreshPrinterStatus(false);return}}catch(_){}}}
async function refreshPrinterStatus(showMessage=false){try{const response=await fetch(`${PRINT_API}/api/status`,{cache:'no-store'});const status=await readJsonResponse(response);if(!response.ok||!status.ok)throw new Error(status.error||`Status service returned ${response.status}`);printerState=status.state||'offline';applyPrinterState(printerState,status);if(showMessage)showToast(formatStatus(status),status.state==='offline'?'error':'success')}catch(error){printerState='offline';applyPrinterState('offline',{label:'Status unavailable',queueDepth:0,lastSeen:null});if(showMessage)showToast(`Printer status unavailable: ${error.message}`,'error')}}
function applyPrinterState(state,status={}){const button=$('cloudPrintButton');if(button){button.className=`print-button state-${state}`;if(state==='idle')button.textContent='Print';else if(state==='printing')button.textContent='Queue print';else if(state==='offline')button.textContent='Queue offline';else button.textContent='Checking…'}const box=$('settingsPrinterStatus');if(box)box.innerHTML=`<span class="status-dot ${state}"></span><span>${esc(formatStatus(status,state))}</span>`;}
function formatStatus(status={},fallbackState=printerState){const state=status.state||fallbackState;if(state==='idle')return'ResusPro printer: Idle';if(state==='printing'){const count=Number(status.queueDepth||0);return`ResusPro printer: ${status.label||'Printing'}${count?` · ${count} queued`:''}`}const seen=status.lastSeen?new Date(status.lastSeen).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'}):'never';return`ResusPro printer: ${status.label||'Offline'} · last seen ${seen}`;}
async function buildReceiptPng(sourceLines=receiptLines()){const lines=withoutDuplicateTextBrand(sourceLines);const width=576,margin=24,brandHeight=110,titleGap=10;const longest=Math.max(32,...lines.map(line=>String(line).length));const fontSize=Math.max(16,Math.min(24,Math.floor((width-(margin*2))/(longest*0.61))));const lineHeight=fontSize+5;const height=Math.min(1800,margin+brandHeight+titleGap+lines.length*lineHeight+margin);const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;const ctx=canvas.getContext('2d',{alpha:false});ctx.fillStyle='#fff';ctx.fillRect(0,0,width,height);ctx.fillStyle='#000';let y=margin;drawThermalBrand(ctx,width,y);y+=brandHeight+titleGap;ctx.font=`${fontSize}px "Courier New", monospace`;ctx.textBaseline='top';for(const line of lines){if(y+lineHeight>height-margin)break;const isHeading=line==='PATIENT / SCENARIO'||line==='RESUS BAY / LOCATION'||line==='PARAMETERS';const isAbnormal=line.includes('↑')||line.includes('↓');ctx.font=(isHeading||isAbnormal)?`bold ${fontSize}px "Courier New", monospace`:`${fontSize}px "Courier New", monospace`;ctx.fillText(line,margin,y);y+=lineHeight}const pngBytes=await encodeMonochromePng(canvas,220);return{base64:bytesToBase64(pngBytes),height,width,bitDepth:1};}
async function encodeMonochromePng(canvas,threshold=220){if(typeof CompressionStream!=='function')throw new Error('This browser cannot create the printer-safe monochrome PNG. Please update Chrome or Android System WebView.');const width=canvas.width,height=canvas.height,ctx=canvas.getContext('2d',{willReadFrequently:true});const rgba=ctx.getImageData(0,0,width,height).data;const rowBytes=Math.ceil(width/8),raw=new Uint8Array(height*(rowBytes+1));let source=0,target=0;for(let y=0;y<height;y++){raw[target++]=0;for(let byteIndex=0;byteIndex<rowBytes;byteIndex++){let packed=0;for(let bit=0;bit<8;bit++){const x=byteIndex*8+bit;let white=1;if(x<width){const index=source+x*4;const alpha=rgba[index+3]/255;const luminance=((0.2126*rgba[index])+(0.7152*rgba[index+1])+(0.0722*rgba[index+2]))*alpha+(255*(1-alpha));white=luminance>=threshold?1:0}packed|=white<<(7-bit)}raw[target++]=packed}source+=width*4}const compressedStream=new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate'));const compressed=new Uint8Array(await new Response(compressedStream).arrayBuffer());const ihdr=new Uint8Array(13);writeUint32(ihdr,0,width);writeUint32(ihdr,4,height);ihdr[8]=1;ihdr[9]=0;ihdr[10]=0;ihdr[11]=0;ihdr[12]=0;return concatBytes(new Uint8Array([137,80,78,71,13,10,26,10]),pngChunk('IHDR',ihdr),pngChunk('IDAT',compressed),pngChunk('IEND',new Uint8Array(0)));}
function pngChunk(type,data){const typeBytes=new TextEncoder().encode(type),chunk=new Uint8Array(12+data.length);writeUint32(chunk,0,data.length);chunk.set(typeBytes,4);chunk.set(data,8);const crcInput=new Uint8Array(typeBytes.length+data.length);crcInput.set(typeBytes);crcInput.set(data,typeBytes.length);writeUint32(chunk,8+data.length,crc32(crcInput));return chunk;}
const CRC32_TABLE=(()=>{const table=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xedb88320^(c>>>1)):(c>>>1);table[n]=c>>>0}return table})();
function crc32(bytes){let c=0xffffffff;for(const byte of bytes)c=CRC32_TABLE[(c^byte)&0xff]^(c>>>8);return(c^0xffffffff)>>>0;}
function writeUint32(bytes,offset,value){bytes[offset]=(value>>>24)&255;bytes[offset+1]=(value>>>16)&255;bytes[offset+2]=(value>>>8)&255;bytes[offset+3]=value&255;}
function concatBytes(...parts){const total=parts.reduce((sum,part)=>sum+part.length,0),out=new Uint8Array(total);let offset=0;for(const part of parts){out.set(part,offset);offset+=part.length}return out;}
function bytesToBase64(bytes){let binary='';const chunk=0x8000;for(let i=0;i<bytes.length;i+=chunk)binary+=String.fromCharCode(...bytes.subarray(i,i+chunk));return btoa(binary);}
function drawThermalBrand(ctx,width,y){ctx.save();ctx.fillStyle='#000';ctx.strokeStyle='#000';ctx.lineWidth=3.8;ctx.textBaseline='alphabetic';ctx.textAlign='left';const brand='RESUS PRO';ctx.font='bold 50px Arial, sans-serif';const brandWidth=ctx.measureText(brand).width;const shieldWidth=48,gap=16,total=brandWidth+gap+shieldWidth,x=(width-total)/2;ctx.fillText(brand,x,y+53);const sx=x+brandWidth+gap,sy=y+7;ctx.beginPath();ctx.moveTo(sx+24,sy);ctx.lineTo(sx+44,sy+9);ctx.lineTo(sx+40,sy+41);ctx.quadraticCurveTo(sx+24,sy+61,sx+8,sy+41);ctx.lineTo(sx+4,sy+9);ctx.closePath();ctx.stroke();ctx.beginPath();ctx.moveTo(sx+10,sy+31);ctx.lineTo(sx+18,sy+31);ctx.lineTo(sx+22,sy+21);ctx.lineTo(sx+27,sy+40);ctx.lineTo(sx+31,sy+31);ctx.lineTo(sx+39,sy+31);ctx.stroke();ctx.font='16px Arial, sans-serif';ctx.textAlign='center';ctx.fillText('Professional Medical Training',width/2,y+92);ctx.restore();}
function localPrint(kind){saveHistory(kind==='pdf'?'PDF/local print':'Local print');render();closeSettings();setTimeout(()=>window.print(),100);}
async function copyReceipt(){try{await navigator.clipboard.writeText(receiptText());saveHistory('Copied');showToast('Receipt copied.','success')}catch(error){showToast(`Could not copy: ${error.message}`,'error')}}
function openSettings(){render();renderHistory();$('settingsModal').classList.add('open');refreshPrinterStatus(false);}
function closeSettings(){$('settingsModal').classList.remove('open');}
function backdropClose(event,id){if(event.target.id===id)event.target.classList.remove('open');}
function saveHistory(modeOut,jobId=''){const item={time:new Date().toISOString(),mode:modeOut,jobId,type:mode,patientId:cleanField($('patientId').value),resusBay:cleanField($('resusBay').value),sample:mode==='bloodgas'?sampleType:viscoType+' '+assay,text:receiptText()};const arr=JSON.parse(localStorage.getItem('resusproBloodGasHistory')||'[]');arr.unshift(item);localStorage.setItem('resusproBloodGasHistory',JSON.stringify(arr.slice(0,100)));renderHistory();}
function renderHistory(){const el=$('historyList');const arr=JSON.parse(localStorage.getItem('resusproBloodGasHistory')||'[]');if(!arr.length){el.innerHTML='<p class="muted">No outputs saved yet on this device.</p>';return}el.innerHTML=arr.slice(0,20).map(h=>{const details=[h.patientId||h.scenario,h.resusBay,h.sample].filter(Boolean).join(' · ');return`<div class="history-item"><b>${esc(new Date(h.time).toLocaleString('en-GB'))} · ${esc(h.mode)} · ${esc(h.type||'bloodgas')}</b>${details?`<span class="muted">${esc(details)}</span>`:''}</div>`}).join('');}
function clearHistory(){if(confirm('Clear saved output history on this device?')){localStorage.removeItem('resusproBloodGasHistory');renderHistory();}}
function showToast(message,type=''){const toast=$('toast');toast.textContent=message;toast.className=`toast show ${type}`;clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>{toast.className='toast'},4200);}
function cleanField(value){return String(value||'').replace(/[\r\n\t]+/g,' ').trim().slice(0,80);}
function sleep(ms){return new Promise(resolve=>setTimeout(resolve,ms));}
async function readJsonResponse(response){const text=await response.text();try{return JSON.parse(text)}catch(_){return{ok:false,error:text||`HTTP ${response.status}`}}}
if('serviceWorker'in navigator){
  let reloadingForNewWorker=false,lastUpdateCheck=0;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!reloadingForNewWorker){reloadingForNewWorker=true;window.location.reload()}});
  window.addEventListener('load',async()=>{
    try{
      const registration=await navigator.serviceWorker.register('./service-worker.js?v=1.0.11',{updateViaCache:'none'});
      const checkForUpdate=async(force=false)=>{const now=Date.now();if(!force&&now-lastUpdateCheck<60000)return;lastUpdateCheck=now;try{await registration.update()}catch(_){}};
      await checkForUpdate(true);setInterval(()=>checkForUpdate(false),5*60*1000);
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkForUpdate(false)});
      window.addEventListener('focus',()=>checkForUpdate(false));window.addEventListener('online',()=>checkForUpdate(true));
    }catch(error){console.warn('Service worker registration failed',error)}
  });
}
window.addEventListener('beforeunload',()=>{if(statusTimer)clearInterval(statusTimer)});
init();
