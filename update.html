<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1565c0">
  <title>Update BloodGas</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#eef2f6;color:#101828;margin:0;padding:24px}
    main{max-width:560px;margin:8vh auto;background:#fff;border:1px solid #d9e1ea;border-radius:18px;padding:24px;box-shadow:0 2px 12px rgba(16,24,40,.08)}
    h1{margin-top:0;color:#1565c0}p{line-height:1.5}.status{font-weight:750}
    button{border:0;border-radius:14px;padding:12px 16px;background:#1565c0;color:#fff;font:inherit;font-weight:750;cursor:pointer}
  </style>
</head>
<body>
<main>
  <h1>Updating BloodGas</h1>
  <p id="status" class="status">Clearing the old PWA cache…</p>
  <p>This does not remove your locally saved patient/scenario details or output history.</p>
  <button id="retry" type="button" hidden>Try again</button>
</main>
<script>
(async()=>{
  const status=document.getElementById('status');
  const retry=document.getElementById('retry');
  try{
    if('serviceWorker'in navigator){
      const registrations=await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.map(registration=>registration.unregister()));
    }
    if('caches'in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(key=>caches.delete(key)));
    }
    status.textContent='Old cache cleared. Loading BloodGas v1.0.14…';
    location.replace(`./index.html?updated=1.0.14&t=${Date.now()}`);
  }catch(error){
    status.textContent=`Update recovery failed: ${error.message}`;
    retry.hidden=false;
    retry.onclick=()=>location.reload();
  }
})();
</script>
</body>
</html>
